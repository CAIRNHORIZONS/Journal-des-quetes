.arme-titre{font-family:"Cinzel",serif;font-size:1.25rem;font-weight:700;margin:0}

/* =================== LISIBILITÉ (23/11) =================== */
:root{--neutre:#4f4234;--zoom:1}
body{zoom:var(--zoom)}
/* 1. Police lisible pour le texte (le pixel reste pour les titres, le bandeau, les onglets et les boutons) */
html,body,:root[data-style="pixel"] body,:root[data-style="pixel"] html{font-family:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45}
.titre,.qj-t b,.hab-txt b,.serie span,.notes,.citation,.apercu,.guide-bulle span,textarea,input,select,.ev-t,.imp-n,.objet small,.sq-c small,.pa-corps,.aide,.vide{font-family:"Atkinson Hyperlegible",-apple-system,sans-serif!important;letter-spacing:0}
.titre{font-size:17px;font-weight:400;color:var(--neutre)}
.aide{font-size:14px}
/* 2. Fonds calmes : plus de fresques ni de motifs derrière le texte ; un grand paysage pixel en tête de chaque écran */
html body{background-image:none!important;background-color:var(--fond)!important}
.banniere{display:none!important}
.paysage{margin:0 -12px 12px;height:150px;overflow:hidden;border-bottom:3px solid #24180d;position:relative}
.paysage svg{display:block;width:100%;height:100%;image-rendering:pixelated}
.carte::before{display:none}
.carte{background:var(--carte);border:2px solid #3b2a18;border-radius:4px;box-shadow:2px 2px 0 rgba(40,25,10,.25)}
/* 3. Cartes courtes : le détail au toucher */
.tache:not(.deplie):not(.principale) .notes,.tache:not(.deplie):not(.principale) .meta .tag:not(.retard):not(.jour),.tache:not(.deplie) .progres{display:none}
.tache:not(.deplie):not(.principale) .meta:not(:has(.tag.retard)):not(:has(.tag.jour)){display:none}
.tache .titre{cursor:pointer}
.tache.deplie{box-shadow:0 0 0 2px var(--or),2px 2px 0 rgba(40,25,10,.25)}
.qj:not(.deplie) .qj-t small,.qj:not(.deplie) .qj-gain,.qj:not(.deplie) .qj-h small{display:none}
.qj-t b{font-weight:400}
.sms.carte:not(.deplie) textarea,.sms.carte:not(.deplie) .actions,.sms.carte:not(.deplie) .meta{display:none}
.sms.carte .titre{cursor:pointer;font-weight:700}
.apercu{color:var(--doux);font-size:15px;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.sms.carte.deplie .apercu{display:none}
/* 4. Le rouge pour ce qui presse ; le reste en couleur neutre (les habitudes du jour restent normales) */
.tache.urgent .titre,.sms.carte.urgent .titre{color:var(--rouge);font-weight:700}
.tag.retard,.tag.jour{color:var(--rouge)}
.pastille{display:none!important}
/* 5. Vrais phylactères de bande dessinée */
.guide{align-items:flex-start;margin:4px 0 14px}
.guide-portrait{background:transparent;border:0;box-shadow:none;padding:0}
.guide-bulle{background:#fff!important;color:#111!important;border:2.5px solid #111!important;border-radius:18px!important;padding:8px 12px!important;box-shadow:3px 3px 0 rgba(0,0,0,.18)!important;margin-left:10px;font-size:15px}
.guide-bulle::before{content:"";position:absolute;left:-14px;top:18px;border:7px solid transparent;border-right:12px solid #111;border-left:0}
.guide-bulle::after{content:"";position:absolute;left:-9px;top:20px;border:5px solid transparent;border-right:9px solid #fff;border-left:0}
.guide-bulle>b{font-family:"Comic Neue","Atkinson Hyperlegible",sans-serif!important;color:#111!important;font-size:12px!important;text-transform:uppercase;letter-spacing:.04em}
.guide-bulle span{font-family:"Comic Neue","Atkinson Hyperlegible",sans-serif!important;font-weight:700;color:#222}
.guide:not(.deplie) .guide-bulle span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 6. Courrier (Missives + Présages) */
.courrier-onglets{margin-top:-2px}
/* 7. Quêtes : liste des chapitres simple, carte du royaume en option */
.chapitres{display:flex!important;flex-direction:column;gap:6px}
.tuile{height:auto!important;min-height:0!important;display:flex!important;align-items:center;gap:10px;padding:12px 14px!important;text-align:left;background:var(--carte)!important;border:2px solid #3b2a18!important;border-radius:4px!important;color:var(--texte)!important}
.tuile svg,.tuile img{display:none!important}
.tuile .tuile-nom{position:static!important;flex:1;font-size:16px;color:var(--texte)!important;text-shadow:none!important;background:none!important;padding:0!important}
.tuile .tuile-nb{position:static!important}
.tuile .tuile-retard{position:static!important}
html:not(.carte-visible) .carte-royaume{display:none}
.carte-bascule{display:block;margin:4px 0 10px auto;border:1px solid var(--trait);background:var(--carte);color:var(--texte);padding:6px 10px;border-radius:4px;font:600 13px "Cinzel",serif}
html.carte-visible .carte-bascule{background:var(--bleu-clair)}
/* 8. Bouton flottant « nouvelle quête » et zone d'inscription qui se déploie */
#fab-quete{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:30;width:58px;height:58px;border-radius:50%!important;border:3px solid #5b350c;background:radial-gradient(circle at 35% 30%,#f6d27a,#c99a2e 70%);box-shadow:0 4px 10px rgba(0,0,0,.35);display:grid;place-items:center;padding:0}
#fab-quete .fab-parchemin{font-size:26px;line-height:1}
#fab-quete .fab-plus{position:absolute;right:4px;bottom:2px;width:20px;height:20px;border-radius:50%;background:#2f7a3a;color:#fff;font:700 16px/20px sans-serif;border:2px solid #fff}
html.saisie-ouverte #fab-quete .fab-plus{background:#8e1c14;transform:rotate(45deg)}
html:not(.saisie-ouverte) .carte.saisie{display:none}
html.saisie-ouverte .carte.saisie{position:fixed;left:10px;right:10px;bottom:calc(144px + env(safe-area-inset-bottom));z-index:29;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);background-color:#f6ecd4!important;max-height:calc(100vh - 170px - env(safe-area-inset-bottom));overflow-y:auto}
#voile-saisie{display:none}
html.saisie-ouverte main{z-index:auto!important}
html.saisie-ouverte #voile-saisie{display:block;position:fixed;inset:0;z-index:28;background:rgba(24,14,5,.88);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
html.saisie-ouverte,html.saisie-ouverte body{overflow:hidden;overscroll-behavior:contain}
.expedition-ecran ~ #fab-quete{display:none}
/* 9. Recherche unique */
#rg{width:100%;padding:10px 12px;font-size:16px;border:2px solid #3b2a18;border-radius:4px;background:var(--carte);color:var(--texte)}
#rg-res{display:flex;flex-direction:column;gap:4px;margin-top:6px}
#rg-res .res{text-align:left;border:1px solid var(--trait);background:var(--carte);color:var(--texte);padding:8px 10px;border-radius:4px;font:15px "Atkinson Hyperlegible",sans-serif}
#rg-res .res small{display:block;color:var(--doux);font-size:12px}
/* 10. Réglages d'affichage */
.reglages-affichage{padding:10px 12px}.ra-ligne{display:flex;align-items:center;gap:8px;margin:6px 0}.ra-ligne span{flex:1}
.ra-ligne button{border:1px solid var(--trait);background:var(--carte);color:var(--texte);padding:6px 12px;border-radius:4px;font:600 15px sans-serif}
.recherche-client{display:block!important}
#v-taches:has(.chapitre-ouvert) > .paysage{display:none}
/* Réglages (engrenage) */
header #reglages{margin-left:auto}
.voile-reglages{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:flex-end;padding:70px 10px 0}
.panneau-reglages{width:min(360px,100%);background:var(--carte);color:var(--texte);border:3px solid #3b2a18;border-radius:6px;box-shadow:4px 4px 0 rgba(0,0,0,.35);padding:10px 12px}
.pr-tete{display:flex;align-items:center;font:700 15px "Silkscreen","Cinzel",monospace;margin-bottom:6px}.pr-tete .pr-fermer{margin-left:auto;border:0;background:none;font-size:18px;color:var(--texte)}
.panneau-reglages .ra-ligne{flex-wrap:wrap}.panneau-reglages .ra-ligne span{flex:1 1 100%;font-weight:700}.panneau-reglages .ra-ligne small{font-weight:400;color:var(--doux)}
.panneau-reglages button.actif{background:linear-gradient(#a8742a,#7a4a12);color:#fff7e3;border-color:#5b350c}
/* Quêtes du jour : tri et catégories */
.qj-barre{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:6px 0 4px;align-items:center}.qj-barre::-webkit-scrollbar{display:none}
.qj-barre .qj-l{font-size:12px;color:var(--doux);flex:none}
.qj-barre button{flex:none;border:1px solid var(--trait);background:var(--carte);color:var(--texte);border-radius:999px!important;padding:5px 10px;font:600 13px "Atkinson Hyperlegible",sans-serif;white-space:nowrap}
.qj-barre button.actif{background:#3b2a18;color:#f3d58b;border-color:#3b2a18}
.qj.tache-jour .qj-t b{font-weight:700}
.titre-argent{margin-top:22px}

/* Rail d'icônes à gauche des quêtes du jour (habitudes en haut, défis plus bas) */
.qj-grille{display:flex;gap:8px;align-items:flex-start;position:relative}
.qj-corps{flex:1;min-width:0}
.rail{flex:none;width:40px;display:flex;flex-direction:column;gap:14px;position:relative;padding-top:4px}
.rail-bloc{display:flex;flex-direction:column;align-items:center;gap:11px;border:2px solid #3b2a18;border-radius:20px!important;padding:6px 0 8px;background:var(--fond)}
.rail-campagne{display:flex;flex-direction:column;align-items:center;padding:4px 0}
html body .rail .r-ico.campagne{width:40px;height:40px;border-radius:50%!important;font-size:20px;background:radial-gradient(circle at 35% 28%,#fff6cf,#f2cf63 35%,#c8961f 70%,#7d5410);border:2px solid #6b4a0e;box-shadow:0 0 0 2px #f6dc85,0 0 10px rgba(242,190,60,.65),0 2px 3px rgba(0,0,0,.35)}
.r-bulle-camp{border-color:#8a5f12!important;box-shadow:0 0 0 2px #f2cf63,3px 3px 0 rgba(0,0,0,.2)!important}
.r-ico svg,.r-bulle b svg,.hab-ico svg{vertical-align:middle}
.r-lbl{font-size:12px;color:var(--doux);line-height:1}
.r-ico{width:32px;height:32px;padding:0;display:grid;place-items:center;font-size:18px;line-height:1;border-radius:50%!important;background:var(--carte);border:1px solid var(--trait);position:relative;cursor:pointer}
.r-ico.sel{box-shadow:0 0 0 2px var(--or)}
.r-ico.fait{background:linear-gradient(#6c9a4c,#33502a);border-color:#243a1c}
.r-ico.fait::after{content:"✓";position:absolute;right:-4px;top:-4px;font:700 10px sans-serif;color:#fff;background:#2f7a3a;border-radius:50%;width:14px;height:14px;line-height:14px;text-align:center}
.r-ico i{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font:700 9px/1 sans-serif;font-style:normal;background:#2f7a3a;color:#fff;border-radius:6px;padding:1px 3px;white-space:nowrap}
.r-ico.eclat{animation:eclat .5s}
@keyframes eclat{50%{transform:scale(1.35)}}
.r-bulle{scroll-margin:70px 0 150px;position:absolute;left:46px;z-index:6;width:min(250px,70vw);background:#fff;color:#111;border:2.5px solid #111;border-radius:14px!important;padding:8px 10px;box-shadow:3px 3px 0 rgba(0,0,0,.2)}
.r-bulle::before{content:"";position:absolute;left:-12px;top:12px;border:6px solid transparent;border-right:10px solid #111;border-left:0}
.r-bulle b{display:block;font-size:15px}
.r-xp{font-size:12px;color:#666}
.r-bts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.r-bts button{border:1px solid #3b2a18;background:#f6ecd4;color:#3b2a18;border-radius:999px!important;padding:6px 10px;font:700 14px "Atkinson Hyperlegible",sans-serif}
.r-bts button.actif{background:#2f7a3a;color:#fff;border-color:#243a1c}
.r-bts .r-hier{background:none;border-style:dashed;font-weight:600}
.r-bts .r-annule{background:none;border-color:#8e1c14;color:#8e1c14;font-weight:600}
.qj.geste-fait{box-shadow:inset 8px 0 0 #2f7a3a}.qj.geste-ignore,.tache.geste-report{box-shadow:inset -8px 0 0 #8e1c14}
.qj,.tache{transition:transform .2s,opacity .25s}.ignoree{opacity:.15;transform:translateX(-60px)!important}

/* Salle des trophées (Tableau de bord, repliée par défaut) */
.trophees{padding:6px 10px}
.tr-tete{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:6px 0;color:var(--texte);font:700 15px "Silkscreen","Cinzel",monospace;text-align:left}
.tr-tete span{flex:1}.tr-tete em{font-style:normal;font:700 13px sans-serif;background:#3b2a18;color:#f3d58b;border-radius:999px;padding:1px 8px}.tr-tete i{font-style:normal;color:var(--doux)}
.tr-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;padding:6px 0 8px}
.tr{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:4px 2px;color:var(--texte)}
.tr-ico{width:48px;height:48px;display:grid;place-items:center;font-size:24px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff6cf,#e9c25a 45%,#a87a1c 80%);border:2px solid #6b4a0e;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.tr-camp .tr-ico{background:radial-gradient(circle at 35% 28%,#fff,#d8dde6 45%,#8d96a6 85%);border-color:#4b5263}
.tr-grand .tr-ico{background:radial-gradient(circle at 35% 28%,#ffe9f0,#c96b8c 50%,#6e2340 90%);border-color:#4a1428}
.tr.sel .tr-ico{box-shadow:0 0 0 3px #f2cf63,0 0 10px rgba(242,190,60,.7)}
.tr-nom{font:600 12px/1.2 "Atkinson Hyperlegible",sans-serif;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tr-detail{border-top:2px dashed var(--trait);padding:8px 2px 4px}
.tr-detail b{display:block;font-size:16px}.tr-detail small{color:var(--doux)}.tr-detail p{margin:6px 0 0;font-size:15px}.tr-equip{color:#5b350c}
#v-tableau{padding-bottom:90px}

.b-or.rubis{color:#ffb3c1}.ico-rubis{vertical-align:-2px}
.poche.rubis{background:#fbe9ec;border:2px solid #7a1022;border-radius:6px;padding:8px 10px;margin:8px 0}
.art-bt.art-rubis{margin-left:6px;background:#fbe9ec;border-color:#7a1022;color:#7a1022}
.art-bt.art-rubis[disabled]{opacity:.45;filter:grayscale(.6)}

/* Rapports de l'Oracle et du Scribe : le bouton « Lu ✓ » reste toujours visible, même carte repliée (24/11) */
.sms.carte.rapport .actions{display:flex!important}
.sms.carte.rapport:not(.deplie) .rapport-txt{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sms.carte.rapport{cursor:pointer}
.sms.carte.rapport:not(.deplie) .rapport-txt::after{content:"";display:block}
.sms.carte.rapport .titre::after{content:" ▾";color:var(--doux);font-size:.8em}
.sms.carte.rapport.deplie .titre::after{content:" ▴"}
.lire-suite{display:block;font-size:13px;color:var(--doux);margin:2px 0 4px}
.sms.carte.rapport.deplie .lire-suite{display:none}
.actions button.or{background:linear-gradient(#e0b84a,#b8860b);color:#3b2a18;border:1px solid #8a6410!important;font-family:"Cinzel",serif}
.qj-voir-tout{display:block;width:100%;margin:8px 0 4px;border:1px dashed var(--trait);background:transparent;color:var(--doux);border-radius:10px;padding:8px 10px;font:600 13px "Atkinson Hyperlegible",sans-serif;cursor:pointer}
.nq-dates{display:flex;gap:8px;margin:8px 0 2px}.nq-dates label{flex:1;display:flex;flex-direction:column;font-size:12px;color:var(--doux);gap:2px}
.nq-dates input,.nq-ev-zone input,.nq-ev-zone select{font:inherit;font-size:14px;padding:5px 6px;border:1px solid var(--trait);border-radius:8px;background:var(--carte);color:var(--texte);min-width:0}
.nq-ev{display:flex;align-items:center;gap:6px;font-size:13px;margin:6px 0 2px}.nq-ev-zone{display:flex;gap:6px;flex-wrap:wrap}.nq-ev-zone[hidden]{display:none}
.nq-imp{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0 2px;color:var(--doux)}.nq-imp select{flex:1;font:inherit;font-size:14px;padding:5px 6px;border:1px solid var(--trait);border-radius:8px;background:var(--carte);color:var(--texte)}
/* 26/11 : bouton « Inscrire » tout en bas de la fenêtre ; parchemin qui s'envole */
.nq-bas{display:flex;margin-top:12px}.nq-bas #nv-ok{flex:1!important;width:100%;padding:12px}
.nq-envol{position:fixed;z-index:60;font-size:28px;pointer-events:none;will-change:transform,opacity}
:root.nuit{--fond:#17110b;--carte:#2a1f14;--texte:#f0e2c2;--doux:#c3a87c;--trait:#5b4429;--bleu:#e0b25a;--bleu-clair:#3a2b18;--rouge:#e0715e;--rouge-clair:#3b1a14;--vert:#9cbf6e;--vert-clair:#25301a;--orange:#f0b955;--orange-clair:#3b2c12;--or:#d9a441;--encre:#f0e2c2;--neutre:#d9c9a8}
/* ===== C : manuscrit enluminé. Plus de cartes : une page de parchemin, enluminures, lettrines, sceaux de cire ===== */
html:is([data-esth="C"],[data-esth="Cn"]){--texte:#3b2a18!important;--doux:#7a6448!important;--carte:#f3e5c4!important;--fond:#ead7ac!important;--trait:#c4a66e!important}
html:is([data-esth="C"],[data-esth="Cn"]) body{background:radial-gradient(ellipse at 50% 40%,#f6ebcf 0%,#ead7ac 70%,#c9ad78 100%) fixed!important}
html:is([data-esth="C"],[data-esth="Cn"]) main{padding:0 22px 96px;position:relative}
html:is([data-esth="C"],[data-esth="Cn"]) main::before{content:"";position:fixed;inset:72px 8px 70px;border:2px solid #9a7a3a;outline:1px solid #9a7a3a;outline-offset:4px;pointer-events:none;border-radius:2px}
html:is([data-esth="C"],[data-esth="Cn"]) .vue>.paysage{height:120px;margin:6px 6px 14px;border:4px double #9a7a3a!important;border-radius:60px 60px 6px 6px;overflow:hidden;box-shadow:0 4px 12px rgba(90,60,20,.3)}
html:is([data-esth="C"],[data-esth="Cn"]) .carte{background:transparent!important;border:0!important;box-shadow:none!important;padding:4px 2px 10px!important;margin:0 0 6px!important}
html:is([data-esth="C"],[data-esth="Cn"]) .carte::after{content:"❦";display:block;text-align:center;color:#9a7a3a;font-size:18px;margin-top:6px;letter-spacing:12px}
html:is([data-esth="C"],[data-esth="Cn"]) .ch-titre{font-family:"Cinzel",serif!important;color:#7a1c1c!important;font-size:18px!important;letter-spacing:.06em;border-bottom:1px solid #b8955a;padding-bottom:4px}
html:is([data-esth="C"],[data-esth="Cn"]) .ch-titre::first-letter{font-size:150%;color:#b8860b}
html:is([data-esth="C"],[data-esth="Cn"]) .qj{border-top:0!important;border-bottom:1px dotted #c4a66e;padding:6px 0!important}
html:is([data-esth="C"],[data-esth="Cn"]) .qj-t b{font-family:"EB Garamond",serif!important;font-size:18px}
html:is([data-esth="C"],[data-esth="Cn"]) .qj-h{font-family:"EB Garamond",serif!important;color:#7a1c1c;font-style:italic}
html:is([data-esth="C"],[data-esth="Cn"]) .hab-case,html:is([data-esth="C"],[data-esth="Cn"]) .coche{border-radius:50%!important;border:2px solid #8e1c14!important;background:radial-gradient(circle at 35% 30%,#f7e7c7,#ead7ac)!important}
html:is([data-esth="C"],[data-esth="Cn"]) .qj.fait .hab-case,html:is([data-esth="C"],[data-esth="Cn"]) .qj.fait .coche{background:radial-gradient(circle at 35% 30%,#d24a3a,#8e1c14 70%)!important;color:#ffe6b0!important}
html:is([data-esth="C"],[data-esth="Cn"]) .qj-barre button{background:transparent!important;border:1px solid #b8955a!important;color:#5a3a12!important}
html:is([data-esth="C"],[data-esth="Cn"]) .qj-barre button.actif{background:#7a1c1c!important;color:#f6ebcf!important;border-color:#7a1c1c!important}
html:is([data-esth="C"],[data-esth="Cn"]) .rail-bloc{background:#f3e5c4;border-color:#9a7a3a}
html:is([data-esth="C"],[data-esth="Cn"]) header{background:linear-gradient(#ead7ac 70%,transparent)!important}
html:is([data-esth="C"],[data-esth="Cn"]) header h1,html:is([data-esth="C"],[data-esth="Cn"]) header .titre-vue{color:#5a3a12!important}
html:is([data-esth="C"],[data-esth="Cn"]) .carte,html:is([data-esth="C"],[data-esth="Cn"]) .qj-t b,html:is([data-esth="C"],[data-esth="Cn"]) .qj-t{color:#3b2a18!important}

/* C, compléments : bandeau, phylactères, chapitres, missives, boutique, trophées */
html:is([data-esth="C"],[data-esth="Cn"]) .ch-titre{display:flex;align-items:center;gap:8px}
html:is([data-esth="C"],[data-esth="Cn"]) .tuile{background:transparent!important;border:0!important;border-bottom:1px dotted #b8955a!important;border-radius:0!important;font-family:"EB Garamond",serif}
html:is([data-esth="C"],[data-esth="Cn"]) .tuile .tuile-nom{font-family:"EB Garamond",serif!important;font-size:19px!important}
html:is([data-esth="C"],[data-esth="Cn"]) .tuile .tuile-nom::first-letter{font-family:"Cinzel",serif;color:#7a1c1c;font-size:140%}
html:is([data-esth="C"],[data-esth="Cn"]) .guide-bulle{background:#fbf3df!important;border-color:#7a5a2a!important;border-radius:4px!important}
html:is([data-esth="C"],[data-esth="Cn"]) .guide-bulle span{font-family:"EB Garamond",serif!important;font-style:italic;font-weight:500;font-size:17px}
html:is([data-esth="C"],[data-esth="Cn"]) .sms.carte .titre{font-family:"EB Garamond",serif!important;font-size:18px}
html:is([data-esth="C"],[data-esth="Cn"]) .apercu{font-family:"EB Garamond",serif!important;font-style:italic}
html:is([data-esth="C"],[data-esth="Cn"]) .article{background:transparent!important;border:1px solid #c4a66e!important;border-radius:2px!important;box-shadow:none!important}
html:is([data-esth="C"],[data-esth="Cn"]) .art-bt{background:transparent!important;border:1px solid #7a5a2a!important;color:#5a3a12!important}
html:is([data-esth="C"],[data-esth="Cn"]) .ch,html:is([data-esth="C"],[data-esth="Cn"]) .pole,html:is([data-esth="C"],[data-esth="Cn"]) .puce{background:transparent!important;border:1px solid #c4a66e!important;border-radius:2px!important;box-shadow:none!important}
html:is([data-esth="C"],[data-esth="Cn"]) .ch b{font-family:"Cinzel",serif;color:#7a1c1c}
html:is([data-esth="C"],[data-esth="Cn"]) nav{background:linear-gradient(#5a3a12,#3b2a18)!important}

/* Cn : le même manuscrit, mais à la chandelle (le soir) : vélin sombre, encre dorée */
html[data-esth="Cn"]{--texte:#f1e3c2!important;--doux:#c9b48a!important;--carte:#2a2118!important;--fond:#1c160f!important;--trait:#6a5530!important}
html[data-esth="Cn"] body{background:radial-gradient(ellipse at 50% 35%,#3a2c1c 0%,#21190f 65%,#120d07 100%) fixed!important}
html[data-esth="Cn"] main::before{border-color:#8a6a2a;outline-color:#8a6a2a}
html[data-esth="Cn"] header{background:linear-gradient(#1c160f 70%,transparent)!important}
html[data-esth="Cn"] header h1,html[data-esth="Cn"] header .titre-vue{color:#e8c46a!important}
html[data-esth="Cn"] .carte,html[data-esth="Cn"] .qj-t b,html[data-esth="Cn"] .qj-t{color:#f1e3c2!important}
html[data-esth="Cn"] .ch-titre{color:#e8c46a!important;border-color:#6a5530}
html[data-esth="Cn"] .ch-titre::first-letter{color:#ffdf8a}
html[data-esth="Cn"] .qj-h{color:#e8a46a!important}
html[data-esth="Cn"] .qj{border-bottom-color:#5a4828!important}
html[data-esth="Cn"] .qj-barre button{border-color:#8a6a2a!important;color:#e8d2a0!important}
html[data-esth="Cn"] .qj-barre button.actif{background:#8e1c14!important;color:#ffe9b8!important}
html[data-esth="Cn"] .hab-case,html[data-esth="Cn"] .coche{background:radial-gradient(circle at 35% 30%,#3a2c1c,#21190f)!important;border-color:#c0392b!important}
html[data-esth="Cn"] .rail-bloc{background:#2a2118;border-color:#8a6a2a}
html[data-esth="Cn"] .carte::after{color:#8a6a2a}
html[data-esth="Cn"] .vue>.paysage{border-color:#8a6a2a!important}
html[data-esth="Cn"] .guide-bulle{background:#f6ead0!important}
html[data-esth="Cn"] .guide-bulle span,html[data-esth="Cn"] .guide-bulle b{color:#2a1d10!important}
html[data-esth="C"] .pole b,html[data-esth="C"] h2,html[data-esth="C"] h2 span{color:#7a1c1c!important;font-family:"Cinzel",serif!important}
html[data-esth="Cn"] .pole b,html[data-esth="Cn"] h2,html[data-esth="Cn"] h2 span{color:#e8c46a!important;font-family:"Cinzel",serif!important}
html:is([data-esth="C"],[data-esth="Cn"]) h2{letter-spacing:.08em;text-transform:none}

html[data-esth="C"] :is(.sms.carte .titre,.tr-nom,.tr-tete,.article b,.tuile-nom,.titre){color:#3b2a18!important}
html[data-esth="C"] :is(.tr-detail small,.article small,.apercu){color:#7a6448!important}
html[data-esth="Cn"] :is(.sms.carte .titre,.tr-nom,.tr-tete,.article b,.tuile-nom,.titre){color:#f1e3c2!important}
html:is([data-esth="C"],[data-esth="Cn"]) .tr-tete span{font-family:"Cinzel",serif!important;color:#7a1c1c!important}
html[data-esth="Cn"] .tr-tete span{color:#e8c46a!important}
html:is([data-esth="C"],[data-esth="Cn"]) .tr-detail{border-top:1px solid #b8955a}
html[data-esth="Cn"] .ch b{color:#e8c46a!important}

/* ===== Finitions du manuscrit (24/11) ===== */
/* en-tête : titre calligraphié, boutons de parchemin */
html:is([data-esth="C"],[data-esth="Cn"]) #titre{font-family:"Cinzel",serif!important;letter-spacing:.06em;font-weight:700;text-transform:none}
html[data-esth="C"] #titre{color:#5a1a12!important}
html[data-esth="Cn"] #titre{color:#e8c46a!important}
html[data-esth="C"] header .btn-ico,html[data-esth="C"] header #reglages{background:#f3e5c4!important;border:1px solid #9a7a3a!important;color:#5a3a12!important;box-shadow:none!important}
html[data-esth="Cn"] header .btn-ico,html[data-esth="Cn"] header #reglages{background:#2a2118!important;border:1px solid #8a6a2a!important;color:#e8c46a!important;box-shadow:none!important}
/* bandeau : une reliure de cuir à filet doré */
html:is([data-esth="C"],[data-esth="Cn"]) #bandeau>*{border-radius:4px}
html:is([data-esth="C"],[data-esth="Cn"]) .bandeau{background:linear-gradient(#5a3418,#3a2010)!important;border:2px solid #b8955a!important;box-shadow:inset 0 0 0 1px #2a170a,0 3px 8px rgba(60,30,10,.35)!important}
/* carte de renommée : un cartouche de parchemin */
html[data-esth="C"] .renommee{background:linear-gradient(#f6ead0,#ecd9ae)!important;border:3px double #9a7a3a!important;color:#3b2a18!important;box-shadow:0 3px 10px rgba(90,60,20,.25)!important}
html[data-esth="C"] .renommee *{color:#3b2a18}
html[data-esth="C"] .renommee b,html[data-esth="C"] .renommee strong{color:#7a1c1c!important}
html[data-esth="Cn"] .renommee{background:linear-gradient(#2f2418,#21190f)!important;border:3px double #8a6a2a!important}
/* onglets Missives / Présages : signets */
html:is([data-esth="C"],[data-esth="Cn"]) .av-onglets button{font-family:"Cinzel",serif!important;letter-spacing:.04em;border-radius:0 0 6px 6px!important;border:1px solid #9a7a3a!important;border-top:0!important;background:transparent!important;color:#5a3a12!important;box-shadow:none!important}
html:is([data-esth="C"],[data-esth="Cn"]) .av-onglets button.actif{background:#7a1c1c!important;color:#f6ebcf!important;padding-bottom:10px}
html[data-esth="Cn"] .av-onglets button{color:#e8d2a0!important}

/* 1. Lettrines enluminées */
.lettrine{display:none}
html:is([data-esth="C"],[data-esth="Cn"]) .lettrine{display:inline-grid;place-items:center;font-family:"Cinzel",serif;font-weight:700;font-size:1.25em;line-height:1;width:1.35em;height:1.35em;margin-right:.08em;color:#fff4d6;background:radial-gradient(circle at 30% 25%,#c0392b,#7a1c1c 70%);border:2px solid #d4a537;box-shadow:inset 0 0 0 1px #5a1010,0 1px 2px rgba(0,0,0,.3);border-radius:2px;vertical-align:-.12em;position:relative}
html:is([data-esth="C"],[data-esth="Cn"]) .lettrine::after{content:"";position:absolute;inset:-5px;border:1px dotted #b8860b;border-radius:3px;pointer-events:none}
html:is([data-esth="C"],[data-esth="Cn"]) .ch-titre::first-letter{font-size:inherit;color:inherit}

/* 2. Marges illustrées : une frise dans chaque marge, au motif du chapitre ouvert */
.marge{display:none}
html:is([data-esth="C"],[data-esth="Cn"]) .marge{display:block;position:fixed;top:80px;bottom:76px;width:13px;z-index:0;pointer-events:none;background-repeat:repeat-y;background-size:13px 40px;opacity:.75}
html:is([data-esth="C"],[data-esth="Cn"]) .marge.g{left:9px}
html:is([data-esth="C"],[data-esth="Cn"]) .marge.d{right:9px}
html:is([data-esth="C"],[data-esth="Cn"]) main{position:relative;z-index:1}

/* 3. Le sceau de cire qui se pose */
.sceau{position:fixed;z-index:60;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e0574a,#a3241a 55%,#6e140e 100%);box-shadow:0 2px 4px rgba(0,0,0,.4),inset 0 -3px 6px rgba(0,0,0,.35);display:grid;place-items:center;color:#ffd9a0;font:700 20px "Cinzel",serif;pointer-events:none;animation:sceau .75s cubic-bezier(.2,.9,.3,1.2) forwards}
.sceau::before{content:"";position:absolute;inset:-5px;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;background:inherit;z-index:-1;filter:brightness(.9)}
@keyframes sceau{0%{transform:scale(2.4) rotate(-25deg);opacity:0}45%{transform:scale(.9) rotate(4deg);opacity:1}60%{transform:scale(1.06)}75%{transform:scale(1)}100%{transform:scale(1);opacity:0}}

/* 4. Les pages qui se tournent */
html:is([data-esth="C"],[data-esth="Cn"]) .vue.tourne{animation:tourne .45s ease-out;transform-origin:left center}
@keyframes tourne{0%{opacity:0;transform:perspective(900px) rotateY(-28deg) translateX(14px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.vue.tourne,.sceau{animation:none!important}}

/* ===== Manuscrit, 2e passe ===== */
/* 1. sceaux de couleur (cases cochées et sceau qui tombe) */
.sceau.sc-bleu{background:radial-gradient(circle at 35% 30%,#5a8ad8,#1f4a9a 55%,#0f2a5e 100%)}
.sceau.sc-rouge{background:radial-gradient(circle at 35% 30%,#e0574a,#a3241a 55%,#6e140e 100%)}
.sceau.sc-vert{background:radial-gradient(circle at 35% 30%,#6ab86a,#2f7a3a 55%,#1a4a22 100%)}
.sceau.sc-or{background:radial-gradient(circle at 35% 30%,#ffe9a0,#d4a537 55%,#8a6410 100%);color:#5a3a12}
html:is([data-esth="C"],[data-esth="Cn"]) [data-sceau="bleu"]:is(.faite,.fait) :is(.coche,.qj-case,.hab-case){background:radial-gradient(circle at 35% 30%,#5a8ad8,#1f4a9a 70%)!important;border-color:#1f4a9a!important;color:#e8f0ff!important}
html:is([data-esth="C"],[data-esth="Cn"]) [data-sceau="rouge"]:is(.faite,.fait) :is(.coche,.qj-case,.hab-case){background:radial-gradient(circle at 35% 30%,#d24a3a,#8e1c14 70%)!important;border-color:#8e1c14!important;color:#ffe6b0!important}
html:is([data-esth="C"],[data-esth="Cn"]) [data-sceau="vert"]:is(.faite,.fait) :is(.coche,.qj-case,.hab-case){background:radial-gradient(circle at 35% 30%,#6ab86a,#2f7a3a 70%)!important;border-color:#2f7a3a!important;color:#eaffea!important}
html:is([data-esth="C"],[data-esth="Cn"]) [data-sceau="or"]:is(.faite,.fait) :is(.coche,.qj-case,.hab-case){background:radial-gradient(circle at 35% 30%,#ffe9a0,#d4a537 70%)!important;border-color:#8a6410!important;color:#5a3a12!important}
html:is([data-esth="C"],[data-esth="Cn"]) [data-sceau="bleu"]:not(.faite):not(.fait) :is(.coche,.qj-case){border-color:#1f4a9a!important}
html:is([data-esth="C"],[data-esth="Cn"]) [data-sceau="vert"]:not(.faite):not(.fait) :is(.coche,.qj-case){border-color:#2f7a3a!important}
html:is([data-esth="C"],[data-esth="Cn"]) [data-sceau="or"]:not(.faite):not(.fait) :is(.coche,.qj-case){border-color:#b8860b!important}
/* 2. annotations en marge */
.annot{display:none}
html:is([data-esth="C"],[data-esth="Cn"]) .annot{display:block;font:500 15px/1.1 "Dancing Script",cursive;color:#8a5a2a;transform:rotate(-2deg);margin-top:2px;font-style:normal}
html[data-esth="Cn"] .annot{color:#d4a560}
/* 3. page de garde */
.page-garde{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#f6ebcf,#e2cc98 70%,#b89a62);animation:pgEntre .4s ease-out;cursor:pointer}
html[data-esth="Cn"] .page-garde{background:radial-gradient(ellipse at 50% 40%,#3a2c1c,#1c140c 75%)}
.page-garde.part{animation:pgPart .5s ease-in forwards}
.pg-cadre{width:min(330px,84vw);padding:26px 18px;text-align:center;border:3px double #9a7a3a;outline:1px solid #9a7a3a;outline-offset:6px;color:#3b2a18}
html[data-esth="Cn"] .pg-cadre{color:#f1e3c2}
.pg-blason{width:70px;height:82px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.pg-titre{font:700 24px "Cinzel",serif;color:#7a1c1c;margin-top:8px}
html[data-esth="Cn"] .pg-titre{color:#e8c46a}
.pg-sous{font:italic 17px "EB Garamond",serif}
.pg-orne{color:#9a7a3a;font-size:22px;margin:8px 0}
.pg-date{font:600 20px "EB Garamond",serif;text-transform:capitalize}
.pg-date small{display:block;font:500 14px "Cinzel",serif;text-transform:none;color:#8a6a3a}
.pg-adage{margin-top:14px;font:500 21px/1.25 "Dancing Script",cursive;color:#5a3a12}
html[data-esth="Cn"] .pg-adage{color:#e8d2a0}
@keyframes pgEntre{from{opacity:0}to{opacity:1}}
@keyframes pgPart{to{opacity:0;transform:perspective(900px) rotateY(-70deg);transform-origin:left center}}
/* 4. livre d'heures */
.heures{display:none}
html:is([data-esth="C"],[data-esth="Cn"]) .heures{display:block;text-align:center;margin:-6px 0 10px;font:16px "EB Garamond",serif;color:#5a3a12}
html:is([data-esth="C"],[data-esth="Cn"]) .heures b{font:700 17px "Cinzel",serif;color:#7a1c1c;letter-spacing:.05em}
html[data-esth="Cn"] .heures{color:#e8d2a0}
html[data-esth="Cn"] .heures b{color:#e8c46a}
/* 5. signets de chapitre : la barre du bas devient des rubans qui dépassent de la page */
html:is([data-esth="C"],[data-esth="Cn"]) nav{background:linear-gradient(#4a2e16,#2e1c0c)!important;border-top:3px solid #b8955a!important;padding:0 6px env(safe-area-inset-bottom);gap:6px;align-items:flex-start;overflow:visible}
html:is([data-esth="C"],[data-esth="Cn"]) nav button{position:relative;margin-top:-3px;padding:6px 2px 16px!important;color:#fff4d6!important;font-family:"Cinzel",serif!important;font-size:10px!important;letter-spacing:.02em;clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);box-shadow:none!important;border:0!important;transition:transform .2s,padding .2s;transform:translateY(-2px)}
html:is([data-esth="C"],[data-esth="Cn"]) nav button[data-vue="jour"]{background:linear-gradient(#a3241a,#7a1c1c)!important}
html:is([data-esth="C"],[data-esth="Cn"]) nav button[data-vue="tableau"]{background:linear-gradient(#2f5a9a,#1f3f72)!important}
html:is([data-esth="C"],[data-esth="Cn"]) nav button[data-vue="taches"]{background:linear-gradient(#c8961f,#8a6410)!important}
html:is([data-esth="C"],[data-esth="Cn"]) nav button[data-vue="sms"]{background:linear-gradient(#3f7a3a,#2a5226)!important}
html:is([data-esth="C"],[data-esth="Cn"]) nav button[data-vue="aventure"]{background:linear-gradient(#6a3a8a,#4a2464)!important}
html:is([data-esth="C"],[data-esth="Cn"]) nav button.actif{padding-bottom:24px!important;transform:translateY(0);filter:brightness(1.12)}
html:is([data-esth="C"],[data-esth="Cn"]) nav button:not(.actif){filter:saturate(.75) brightness(.9)}
/* 8. la plume du Scribe */
html:is([data-esth="C"],[data-esth="Cn"]) .guide-bulle span.plume::after{content:"✒";margin-left:3px;font-style:normal;color:#5a3a12}
html:is([data-esth="C"],[data-esth="Cn"]) .b-niv{font-family:"Cinzel",serif!important;font-weight:700;letter-spacing:-.02em}
/* ===== Parchemins qui se déroulent (25/11) : bulle des habitudes et fenêtre « Nouvelle quête ». Jour : vélin clair ; nuit : parchemin à la chandelle ===== */
:root{--pa-clair:#f7ebcf;--pa-fonce:#ead39f;--pa-tache:rgba(150,100,35,.16);--pa-bord:rgba(120,78,25,.45);--pa-pli:#cfae6e;--pa-encre:#3b2a18;--pa-doux:#7a6448;--pa-ligne:rgba(122,90,40,.22);
  --rou-a:#7d5a26;--rou-b:#c49a58;--rou-c:#f3e2b8;--rou-d:#e0c58a}
html.nuit,html[data-esth="Cn"]{--pa-clair:#6a5232;--pa-fonce:#46341f;--pa-tache:rgba(255,200,110,.12);--pa-bord:rgba(20,10,0,.6);--pa-pli:#5a4426;--pa-encre:#f1e3c2;--pa-doux:#c9b48a;--pa-ligne:rgba(240,210,150,.16);
  --rou-a:#3a2812;--rou-b:#7a5a2c;--rou-c:#b8955a;--rou-d:#8a6a36}
@keyframes paDeroule{from{clip-path:inset(-10px -14px calc(100% - 8px) -14px)}to{clip-path:inset(-10px -14px -14px -14px)}}
@keyframes paRouleau{from{top:-7px}to{top:calc(100% - 7px)}}

/* --- la bulle des habitudes devient un petit parchemin --- */
html body .r-bulle{scroll-margin:190px 0 160px!important;background:none!important;border:0!important;box-shadow:none!important;padding:0!important;color:var(--pa-encre);filter:drop-shadow(2px 4px 3px rgba(40,20,5,.35));animation:paDeroule .45s cubic-bezier(.2,.8,.3,1) both}
html body .r-bulle::before,html body .r-bulle::after{content:"";position:absolute;left:-8px;right:-8px;height:14px;border:0!important;border-radius:7px;z-index:2;
  background:linear-gradient(var(--rou-a),var(--rou-b) 22%,var(--rou-c) 48%,var(--rou-d) 70%,var(--rou-a));box-shadow:0 2px 3px rgba(0,0,0,.3)}
html body .r-bulle::before{top:-7px}
html body .r-bulle::after{top:calc(100% - 7px);animation:paRouleau .45s cubic-bezier(.2,.8,.3,1) both}
.rb-papier{position:relative;padding:16px 14px 16px 16px;
  background:radial-gradient(ellipse at 18% 25%,var(--pa-tache),transparent 45%),radial-gradient(ellipse at 85% 75%,var(--pa-tache),transparent 50%),radial-gradient(circle at 60% 15%,var(--pa-tache),transparent 25%),linear-gradient(170deg,var(--pa-clair),var(--pa-fonce));
  box-shadow:inset 0 0 14px var(--pa-bord);
  clip-path:polygon(0 3px,2% 0,calc(100% - 16px) 0,100% 16px,99.3% 35%,100% 52%,99% 74%,100% 100%,16px 100%,0 calc(100% - 16px),.8% 70%,0 48%,1% 24%)}
/* coins écornés : le pli du parchemin, en haut à droite et en bas à gauche */
.rb-papier::before,.rb-papier::after{content:"";position:absolute;width:16px;height:16px;pointer-events:none}
.rb-papier::before{top:0;right:0;background:linear-gradient(225deg,transparent 50%,var(--pa-pli) 50%,var(--pa-fonce));box-shadow:-1px 1px 2px rgba(0,0,0,.2)}
.rb-papier::after{bottom:0;left:0;background:linear-gradient(45deg,transparent 50%,var(--pa-pli) 50%,var(--pa-fonce));box-shadow:1px -1px 2px rgba(0,0,0,.2)}
.rb-papier>b{font-family:"Cinzel","EB Garamond",serif!important;color:var(--pa-encre)!important;font-size:16px!important}
.rb-papier .r-xp{color:var(--pa-doux)!important;font-family:"EB Garamond",serif;font-size:14px}
.rb-papier .r-bts button{background:rgba(255,250,235,.5);border-color:var(--rou-a)}
html.nuit .rb-papier,html[data-esth="Cn"] .rb-papier{outline:1px solid rgba(232,190,110,.35);outline-offset:-4px}
html.nuit .rb-papier .r-bts button,html[data-esth="Cn"] .rb-papier .r-bts button{background:rgba(0,0,0,.25);color:var(--pa-encre)}
.r-bulle-camp .rb-papier{box-shadow:inset 0 0 14px var(--pa-bord),inset 0 0 0 2px #c8961f}
html body .r-bulle-camp::before,html body .r-bulle-camp::after{background:linear-gradient(#6b4a0e,#c8961f 25%,#fff0b8 50%,#e0b440 72%,#6b4a0e)}

/* --- la fenêtre « Nouvelle quête » : un grand parchemin qui se déroule, des lignes pour écrire --- */
html.saisie-ouverte .carte.saisie{overflow:visible!important;max-height:none!important;border:0!important;border-radius:0!important;padding:22px 16px 20px!important;color:var(--pa-encre);
  background:radial-gradient(ellipse at 15% 20%,var(--pa-tache),transparent 40%),radial-gradient(ellipse at 80% 85%,var(--pa-tache),transparent 45%),radial-gradient(circle at 55% 45%,var(--pa-tache),transparent 30%),linear-gradient(170deg,var(--pa-clair),var(--pa-fonce))!important;
  box-shadow:inset 0 0 22px var(--pa-bord),0 10px 30px rgba(0,0,0,.5)!important;animation:paDeroule .5s cubic-bezier(.2,.8,.3,1) both}
html.saisie-ouverte .carte.saisie::before,html.saisie-ouverte .carte.saisie::after{content:""!important;display:block!important;position:absolute;left:-10px;right:-10px;height:20px;margin:0!important;border-radius:10px;z-index:2;
  background:linear-gradient(var(--rou-a),var(--rou-b) 22%,var(--rou-c) 48%,var(--rou-d) 70%,var(--rou-a))!important;box-shadow:0 3px 4px rgba(0,0,0,.35)}
html.saisie-ouverte .carte.saisie::before{top:-10px}

  if (!J) { v.innerHTML = '<div class="vide">Le tableau du jour n’a pas pu être dressé. Actualise dans un instant.</div>'; try { vueTableau(); } catch (e) {} return; }
  html += '<div class="jour-date">' + esc(J.date.charAt(0).toUpperCase() + J.date.slice(1)) + '</div>';
  try { html += blocCombatDuJour(); } catch (e) {} // 26/11 : combat de musculation du jour (Salle d'arme)
  html += '<div id="qj-unifie">' + blocQuetesUnifie() + '</div>';
  // planning de demain
  var dem = J.agenda.filter(function (e) { return e.jour === 'dem'; });

    + (dem.length ? dem.map(function (e) {
      return '<div class="ev ag-' + esc(e.agenda.toLowerCase()) + (e.agenda === 'Natation' && /^(CP|Muscu)\s/i.test(e.titre) ? ' cliquable' : '') + '" data-titre="' + esc(e.titre) + '"><span class="ev-h">' + (e.journee ? 'journée' : esc(e.debut) + '<small>' + esc(e.fin) + '</small>') + '</span>'
        + '<span class="ev-t">' + esc(e.titre) + (e.lieu ? '<small>📍 ' + esc(e.lieu) + '</small>' : '') + '</span><span class="ev-a">' + esc(e.agenda) + '</span></div>';
    }).join('') : '<div class="vide">Rien dans l’agenda demain.</div>') + '</div>';
  v.innerHTML = html;
  v.querySelectorAll('[data-va]').forEach(function (b) { b.onclick = function () { allerVue(b.dataset.va); }; });
  v.querySelectorAll('.ev.cliquable').forEach(function (b) { b.onclick = function () { ouvrirFiche(b.dataset.titre); }; });
  brancherQuetesUnifie();
  if (false) v.querySelectorAll('.tache-jour .coche').forEach(function (c) {
    c.onclick = function () {
      var el = c.closest('.qj'), n = +el.dataset.n, t = D.taches.filter(function (x) { return x.n === n; })[0];
      if (!t || el.classList.contains('embrase')) return;
      embraser(el, c);
      appel('appCocherTache', [n, t.tache], function (r) { accomplie(el, n, r); });
    };
  });
  vueTableau();
}

function vueTableau() {
  var v = $('v-tableau'), J = D.jour, html = ''; if (!v) return;
  if (!J) { v.innerHTML = '<div class="vide">Le tableau de bord n’a pas pu être dressé. Actualise dans un instant.</div>'; return; }
  var S = J.semaine, xpSem = (D.xpJours || []).slice(-7).reduce(function (a, b) { return a + b; }, 0), pct = Math.min(100, Math.round(100 * S.minutes / (S.plafond || 360)));
  // à traiter
  var nbMiss = D.sms.filter(function (s) { return s.fenetre !== false && (s.statut === 'À valider' || s.statut === 'Erreur'); }).length;
  var pres = D.presages || [], nbTrous = pres.filter(function (p) { return p.trou; }).length, nbPres = pres.length - nbTrous;
  var nbResas = D.resas.filter(function (r) { return r.statut === 'À valider'; }).length, puces = [];
  if (nbMiss) puces.push('<button class="puce" data-va="sms">🪶 ' + nbMiss + ' missive' + (nbMiss > 1 ? 's' : '') + ' à sceller</button>');
  if (nbPres) puces.push('<button class="puce" data-va="presages">🔮 ' + nbPres + ' présage' + (nbPres > 1 ? 's' : '') + '</button>');
  if (nbTrous) puces.push('<button class="puce" data-va="presages">🕳️ ' + nbTrous + ' trou' + (nbTrous > 1 ? 's' : '') + ' à combler</button>');
  if (nbResas) puces.push('<button class="puce" data-va="resas">🛡️ ' + nbResas + ' requête' + (nbResas > 1 ? 's' : '') + '</button>');
  if (D.aventure) { var nbDefis = D.aventure.defis.filter(function (d) { return d.fait && !d.reclame; }).length; if (nbDefis) puces.push('<button class="puce" data-av="defis">📯 ' + nbDefis + ' prime' + (nbDefis > 1 ? 's' : '') + ' à réclamer</button>'); }
  if (puces.length) html += '<div class="puces">' + puces.join('') + '</div>';
  // chiffres de la semaine
  html += '<div class="carte chiffres"><div class="ch-titre">⚖️ La semaine</div><div class="ch-grille">'
    + '<div class="ch"><b>' + hhmm(S.minutes) + '</b><span>de cours sur ' + hhmm(S.plafond) + '</span><i class="jauge' + (S.minutes > S.plafond ? ' trop' : '') + '"><u style="width:' + pct + '%"></u></i></div>'
    + '<div class="ch"><b>' + S.nbCours + '</b><span>cours, ' + S.coursRestants + ' à venir</span></div>'
    + '<div class="ch"><b>' + String(S.encaisse).replace('.', ',') + ' €</b><span>encaissés</span></div>'
    + '<div class="ch' + (S.du > 0 ? ' alerte' : '') + '"><b>' + String(S.du).replace('.', ',') + ' €</b><span>restent dus</span></div>'
    + '<div class="ch"><b>' + S.resasSite + '</b><span>réservation' + (S.resasSite > 1 ? 's' : '') + ' du site</span></div>'
    + '<div class="ch"><b>' + xpSem + '</b><span>XP en 7 jours</span></div></div></div>';
  // coffres (Trésor de l'Empire, Bourse, Qonto)
  var PO = D.aventure && D.aventure.poches;

  if (false) html += '<button class="carte coffres" data-av="tresor"><span>🏛️ <b>' + eurCourt(PO.tresor.eurosMois || 0) + '</b> Trésor</span><span>👛 <b>' + eurCourt(PO.bourse.eurosMois || 0) + '</b> Bourse</span><span>⚜ <b>' + Math.round((PO.tresor.ecus || 0) + (PO.bourse.ecus || 0)) + '</b> écus</span>'
    + (PO.qonto ? '<span>🏦 <b>' + eurCourt(PO.qonto.solde) + '</b> Qonto</span>' : '') + '</button>';
  // à recevoir
  if ((J.impayes && J.impayes.length) || (J.factures || []).length) {
    html += '<div class="carte impayes"><div class="ch-titre">💰 À recevoir</div>' + (J.impayes || []).map(function (x) {
      return '<div class="imp" data-id="' + esc(x.id) + '"><span class="imp-n cliquable" data-fiche="' + esc(x.id) + '">' + esc(x.nom) + '</span><b>' + String(x.du).replace('.', ',') + ' €</b>'
        + (x.relanceEnCours ? '<span class="tag">relance prête</span>' : '<button class="gris" data-rel="' + esc(x.id) + '">Relancer</button>')
        + '<button class="vert" data-regle="' + esc(x.id) + '">✓ Réglé</button></div>';
    }).join('') + ((J.factures || []).length ? '<div class="aide">Factures des structures (suivies à part, pas de relance par SMS) :</div>' + J.factures.map(function (x) {
      return '<div class="imp facture"><span class="imp-n">' + esc(x.nom) + '</span><b>' + String(x.du).replace('.', ',') + ' €</b><span class="tag">facture</span></div>'; }).join('') : '') + '</div>';
  }
  // pôles : conseil en patrimoine, appartements, vie perso
  var nbCh = function (l) { return D.taches.filter(function (t) { return !t.aVenir && l.indexOf(t.section) !== -1; }).length; };
  var P = D.poles || {}, cgp = P.cgp || [];
  html += '<div class="poles"><button class="pole" data-ouvrir="Les Horizons ouverts"><b>🔭 Patrimoine</b>' + (cgp.length ? esc(cgp[0].quand) + ' · ' + esc(cgp[0].titre) + (cgp.length > 1 ? '<em> +' + (cgp.length - 1) + ' rdv</em>' : '') : '<em>aucun rdv sous 7 jours</em>') + '<br><em>' + nbCh(['Les Horizons ouverts']) + ' quête(s)</em></button>'
    + '<button class="pole" data-ouvrir="Les Finances de la guilde"><b>💰 Appartements</b><em>' + nbCh(['Les Finances de la guilde']) + ' quête(s)</em></button>'
    + '<button class="pole" data-ouvrir="La Taverne des amis"><b>🍺 Vie perso</b><em>' + nbCh(['La Taverne des amis', 'La Place du bourg', 'La Classe d\'armes', 'La Diligence', 'L\'Orphelinat de l\'Empire']) + ' quête(s)</em></button></div>';
  if (D.aventure && PO) html += '<h2 class="titre-argent"><span>L’argent</span><span></span></h2><div id="tresor-tab">' + vueTresor(D.aventure) + '</div>';
  html += salleTrophees_(); // tout en bas du tableau de bord (demande de Cairn)

// ---------- Salle des trophées : en option (repliée), une icône et un nom par trophée, le récit au toucher ----------
var TR_OUVERTE = false, TR_SEL = -1;
try { TR_OUVERTE = localStorage.getItem('tr-ouverte') === '1'; } catch (e) {}
function salleTrophees_() {

  var h = '<div class="carte trophees"><button class="tr-tete" data-tr-bascule="1"><span>🏆 Salle des trophées</span><em>' + T.length + '</em><i>' + (TR_OUVERTE ? '▲' : '▼') + '</i></button>';
  if (!TR_OUVERTE) return h + '</div>';
  h += '<div class="tr-grille">' + T.map(function (t, i) {
    return '<button class="tr' + (t.cat === 'Campagne' ? ' tr-camp' : t.cat === 'Grand accomplissement' ? ' tr-grand' : '') + (TR_SEL === i ? ' sel' : '') + '" data-tr="' + i + '"><span class="tr-ico">' + icone_(t) + '</span><span class="tr-nom">' + esc(t.nom) + '</span></button>';
  }).join('') + '</div>';

    + (t.recit ? '<p>' + esc(t.recit) + '</p>' : '') + (t.equip ? '<p class="tr-equip">⚔️ Dans ton armurerie : ' + esc(t.equip) + '</p>' : '') + '</div>';
  return h + '</div>';
}
function brancherTrophees_(v) {
  var z = v.querySelector('.trophees'); if (!z) return;
  var re = function () { var n = document.createElement('div'); n.innerHTML = salleTrophees_(); z.replaceWith(n.firstChild); brancherTrophees_(v); };
  var b = z.querySelector('[data-tr-bascule]'); if (b) b.onclick = function () { TR_OUVERTE = !TR_OUVERTE; try { localStorage.setItem('tr-ouverte', TR_OUVERTE ? '1' : '0'); } catch (e) {} re(); };
  z.querySelectorAll('[data-tr]').forEach(function (x) { x.onclick = function () { TR_SEL = TR_SEL === +x.dataset.tr ? -1 : +x.dataset.tr; re(); }; });
}

// ---------- Quêtes du jour : une seule liste, triée (heure, importance, gain) et filtrée par catégorie (chapitre) ----------
var QJ_TRI = 'heure', QJ_CAT = '', QJ_TOUT = false, QJ_MAX_EN_COURS = 5;
try { QJ_TRI = localStorage.getItem('qj-tri') || 'heure'; QJ_CAT = localStorage.getItem('qj-cat') || ''; } catch (e) {}
var CHAP_EVT = { cours: 'Le Royaume des 7 mers', sentinelle: 'Le Royaume des 7 mers', elsport: 'Le Royaume des 7 mers', natation: 'Le Royaume des 7 mers', campus: 'Le Royaume des 7 mers', cgp: 'Les Horizons ouverts', r1: 'Les Horizons ouverts', autre: 'Vie perso' };
function nomCourt_(ch) { return String(ch).replace(/^(Le |La |Les |L')/, '').replace(/ du royaume$| de la guilde$| de l'Empire$| des amis$/, ''); }
function iconeChap_(ch) { var l = (typeof LIEUX !== 'undefined' && LIEUX[String(ch).toLowerCase().trim()]) || null; return l ? l[2] : ch === 'Vie perso' ? '🍺' : ch === 'Quête principale' ? '⚜' : '📍'; }
function elementsQJ_() {
  var A = D.aventure, iso = isoJ(new Date()), out = [];
  ((A && A.quetes) || []).filter(function (q) { return q.jour === iso && q.type !== 'campus'; }).forEach(function (q) {
    out.push({ id: 'c' + q.cle, html: carteQueteJour(q), cat: CHAP_EVT[q.type] || 'Vie perso', heure: q.debut || '99:99', fait: q.fait,
      imp: q.fait ? 0 : q.gemmes ? 70 : q.poche ? 60 : 20, gain: q.gemmes ? q.gemmes / 10 : (q.montant || 0) });
  });
  // 26/11 (Cairn) : une quête commencée (« Commencer le » atteint) apparaît d'elle-même dans les quêtes du jour, jusqu'à ce qu'elle soit faite ou reportée
  D.taches.filter(function (t) { return !t.aVenir && (t.retard || t.aujourdhui || (t.debutIso && t.debutIso <= iso)); }).forEach(function (t) {
    var enCours = !t.retard && !t.aujourdhui;
    out.push({ id: 'n' + t.n, html: '<div class="qj tache-jour" data-n="' + t.n + '"><span class="qj-h">' + (t.retard ? '⚠' : '📜') + '</span><span class="qj-t"><b>' + esc(t.tache) + '</b><small>' + esc(t.section) + (t.retard ? ' · <em>délai dépassé</em>' : enCours ? (t.echeance ? ' · avant le ' + esc(t.echeance) : ' · en cours') : ' · aujourd’hui') + '</small></span><button class="coche" aria-label="Fait"></button></div>',
      cat: t.section, heure: enCours ? '99:99' : '99:98', fait: false, imp: t.retard ? 100 : enCours ? 50 : 80, gain: t.xp || 10, urgent: !enCours, enCours: enCours, ech: t.echeanceIso || '9999-12-31' });
  });
  return out;
}
function blocQuetesUnifie() {
  var tous = elementsQJ_(), A = D.aventure, iso = isoJ(new Date());
  var att = ((A && A.quetes) || []).filter(function (q) { return q.jour < iso && !q.fait && q.type !== 'campus'; });
  if (!tous.length && !att.length) return '<div class="carte quetes-jour"><div class="ch-titre">⚔️ Quêtes du jour</div>' + grille_(rouleauRituel_('Aube') + '<div class="aide">Rien de prévu aujourd’hui.</div>' + rouleauRituel_('Crépuscule')) + '</div>';
  var cats = []; tous.forEach(function (x) { if (cats.indexOf(x.cat) === -1) cats.push(x.cat); });
  if (QJ_CAT && cats.indexOf(QJ_CAT) === -1) QJ_CAT = '';
  var liste = tous.filter(function (x) { return !QJ_CAT || x.cat === QJ_CAT; });
  liste.sort(QJ_TRI === 'importance' ? function (a, b) { return b.imp - a.imp || (a.heure < b.heure ? -1 : 1); }
    : QJ_TRI === 'gain' ? function (a, b) { return (a.fait - b.fait) || (b.gain - a.gain) || (a.heure < b.heure ? -1 : 1); }
    : function (a, b) { return a.heure < b.heure ? -1 : a.heure > b.heure ? 1 : 0; });
  liste = ordonnerQP_(liste); // la quête principale du jour (choisie au rituel de l'aube) passe en tête
  // 26/11 (Cairn) : 5 quêtes « en cours » au plus (les plus proches de leur date limite), bouton « Voir tout » pour le reste
  var enC = liste.filter(function (x) { return x.enCours; }).sort(function (a, b) { return a.ech < b.ech ? -1 : a.ech > b.ech ? 1 : 0; });
  var gardees = enC.slice(0, QJ_MAX_EN_COURS).map(function (x) { return x.id; }), cachees = Math.max(0, enC.length - QJ_MAX_EN_COURS);
  if (!QJ_TOUT && cachees) liste = liste.filter(function (x, i) { return i === 0 || !x.enCours || gardees.indexOf(x.id) >= 0; });
  var boutonTout = cachees ? '<button class="qj-voir-tout" data-tout="1">' + (QJ_TOUT ? '▲ Réduire' : '▼ Voir tout (' + cachees + ' quête' + (cachees > 1 ? 's' : '') + ' en cours de plus)') + '</button>' : '';
  var tot = tous.filter(function (x) { return !x.fait && !x.urgent; }).reduce(function (s, x) { return s + (x.gain || 0); }, 0);
  var html = rouleauRituel_('Aube') + '<div class="qj-barre"><span class="qj-l">Trier</span>' + [['heure', '⏰ Heure'], ['importance', '❗ Importance'], ['gain', '✨ Gain']].map(function (o) { return '<button data-tri="' + o[0] + '" class="' + (QJ_TRI === o[0] ? 'actif' : '') + '">' + o[1] + '</button>'; }).join('') + '</div>'
    + (cats.length > 1 ? '<div class="qj-barre cats"><button data-cat="" class="' + (!QJ_CAT ? 'actif' : '') + '">Tout · ' + tous.length + '</button>' + cats.map(function (c) { var n = tous.filter(function (x) { return x.cat === c; }).length; return '<button data-cat="' + esc(c) + '" class="' + (QJ_CAT === c ? 'actif' : '') + '">' + iconeChap_(c) + ' ' + esc(nomCourt_(c)) + ' · ' + n + '</button>'; }).join('') + '</div>' : '')
    + liste.map(function (x) { return x.html; }).join('') + boutonTout;
  if (att.length) html += '<div class="moment">À valider (jours précédents)</div>' + att.map(function (q) { return carteQueteJour(q).replace('<span class="qj-h">', '<span class="qj-h"><i>' + q.jour.slice(8) + '/' + q.jour.slice(5, 7) + '</i>'); }).join('');
  html += rouleauRituel_('Crépuscule');
  return '<div class="carte quetes-jour"><div class="ch-titre">⚔️ Quêtes du jour</div>' + grille_(html) + '</div>';
}
function brancherQuetesUnifie() {
  var z = $('qj-unifie'); if (!z) return;
  z.querySelectorAll('[data-tri]').forEach(function (b) { b.onclick = function () { QJ_TRI = b.dataset.tri; try { localStorage.setItem('qj-tri', QJ_TRI); } catch (e) {} z.innerHTML = blocQuetesUnifie(); brancherQuetesUnifie(); }; });
  z.querySelectorAll('[data-tout]').forEach(function (b) { b.onclick = function () { QJ_TOUT = !QJ_TOUT; z.innerHTML = blocQuetesUnifie(); brancherQuetesUnifie(); }; });
  z.querySelectorAll('[data-cat]').forEach(function (b) { b.onclick = function () { QJ_CAT = b.dataset.cat; try { localStorage.setItem('qj-cat', QJ_CAT); } catch (e) {} z.innerHTML = blocQuetesUnifie(); brancherQuetesUnifie(); }; });
  try { brancherQuetesJour(z); } catch (e) {}
  brancherRail_(z);
  z.querySelectorAll('[data-rituel]').forEach(function (b) { b.onclick = function () { ouvrirRituel_(b.dataset.rituel); }; });
  reprendreRituel_();
  z.querySelectorAll('.qj').forEach(balayerQJ_);
  z.querySelectorAll('.tache-jour .coche').forEach(function (c) {
    c.onclick = function () {
      var el = c.closest('.qj'), n = +el.dataset.n, t = D.taches.filter(function (x) { return x.n === n; })[0];
      if (!t || el.classList.contains('embrase')) return;
      embraser(el, c);
      appel('appCocherTache', [n, t.tache], function (r) { accomplie(el, n, r); });
    };
  });
}

// ---------- Rail d'icônes à gauche des quêtes du jour : habitudes (✦) en haut, défis (🎯) plus bas ----------
// Toucher une icône ouvre une bulle : « ✓ Accompli », ou les paliers (20 min, 40 min, 1 h, 2 h) pour une habitude à paliers.
var HAB_SEL = '';
function court_(p) { return String(p).replace(/\s*min$/, '′').replace(/\s+/g, ''); }
function grille_(corps) {
  var r = rail_();
  return r ? '<div class="qj-grille">' + r + '<div class="qj-corps">' + corps + '</div></div>' : corps;
}
function rail_() {
  var A = D.aventure; if (!A || !A.habitudes) return '';
  var iso = isoJ(new Date()), pf = A.paliersFaits || {};
  var hab = A.habitudes.filter(function (h) { return h.moment !== 'Défi' && h.moment !== 'Aube' && h.moment !== 'Crépuscule' && estQuotidienne(h); }), def = A.habitudes.filter(function (h) { return h.moment === 'Défi' && enCampagne_(h, iso); });
  if (!hab.length && !def.length) return '';
  var ico = function (h, cls) {
    var fait = !!faitLe_(h, iso), p = fait && pf[h.nom] && pf[h.nom][iso];
    return '<button class="r-ico' + (cls || '') + (fait ? ' fait' : '') + (HAB_SEL === h.nom ? ' sel' : '') + '" data-hab="' + esc(h.nom) + '" aria-label="' + esc(h.nom) + '">' + icone_(h) + (p ? '<i>' + esc(court_(p)) + '</i>' : '') + '</button>';
  };
  // la campagne du mois : une boule dorée tout en haut, dans sa propre bulle
  var camp = def.length ? '<div class="rail-campagne">' + def.map(function (h) { return ico(h, ' campagne'); }).join('') + '</div>' : '';
  var habs = hab.length ? '<div class="rail-bloc r-hab"><span class="r-lbl">✦</span>' + hab.map(function (h) { return ico(h); }).join('') + '</div>' : '';
  return '<div class="rail">' + camp + habs + bulle_(iso) + '</div>';

// Reconnaissance vocale du navigateur quand elle est autorisée ; sinon, le micro du clavier du téléphone fait le même travail.
var reco = null;
function arreterDictee() { if (reco) { try { reco.stop(); } catch (e) {} } }
function dicter() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, zone = $('nv-tache'), bouton = $('nv-micro');
  if (reco) { arreterDictee(); return; }
  if (!SR) { zone.focus(); toast('Touche le 🎤 de ton clavier pour dicter'); return; }
  var base = zone.value ? zone.value.replace(/\s*$/, ' ') : '';
  reco = new SR(); reco.lang = 'fr-FR'; reco.interimResults = true; reco.continuous = true;
  reco.onresult = function (e) {
    var txt = '';
    for (var i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    zone.value = base + txt.charAt(0).toUpperCase() + txt.slice(1);
  };
  reco.onerror = function (e) {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { zone.focus(); toast('Micro non autorisé ici : touche le 🎤 de ton clavier pour dicter'); }
  };
  reco.onend = function () { reco = null; bouton.classList.remove('ecoute'); };
  try { reco.start(); bouton.classList.add('ecoute'); toast('Je t’écoute… touche 🎤 pour arrêter'); }
  catch (e) { reco = null; zone.focus(); toast('Touche le 🎤 de ton clavier pour dicter'); }
}

// ---------- Paysages pixel art 16 bits (générés, selon l'heure et la saison) ----------
function moment_() { var h = new Date().getHours(); return h < 7 ? 'nuit' : h < 10 ? 'aube' : h < 17 ? 'jour' : h < 21 ? 'soir' : 'nuit'; }
function hiver_() { var m = new Date().getMonth(); return m === 11 || m <= 1; }
var CIELS = { aube: ['#2b2d5a', '#5b4a7a', '#b0607a', '#f08a6a', '#f6c08a'], jour: ['#4a8fd0', '#5aa7d6', '#7cc0e3', '#a5d5ec', '#cdebf5'],
  soir: ['#2a1d45', '#5b2f5a', '#b04a4a', '#e8803a', '#f6b04a'], nuit: ['#070a1e', '#0b1030', '#121a40', '#1a2550', '#22305e'] };
var TEINTES = { aube: { loin: '#6a5a8a', mil: '#4f6a5a', pres: '#3d5a3a', sol: '#5a4630' }, jour: { loin: '#7d93b5', mil: '#5f8f4e', pres: '#4a7a3a', sol: '#7a5a32' },
  soir: { loin: '#6a3f5a', mil: '#5a4a3a', pres: '#3f3a2a', sol: '#4a3420' }, nuit: { loin: '#1f2a48', mil: '#1a2a2a', pres: '#142020', sol: '#1a140e' } };
function hasard_(graine) { var s = 0; for (var i = 0; i < graine.length; i++) s = (s * 31 + graine.charCodeAt(i)) >>> 0; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function paysage(theme) {
  var W = 120, H = 44, m = moment_(), neige = hiver_(), rnd = hasard_(theme + m), r = '', c = CIELS[m], t = TEINTES[m];
  var px = function (x, y, w, h, col) { r += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + col + '"/>'; };
  for (var i = 0; i < 5; i++) px(0, i * 6, W, 6.2, c[i]);
  px(0, 30, W, 14, c[4]);
  if (m === 'nuit') { for (i = 0; i < 40; i++) px(Math.floor(rnd() * W), Math.floor(rnd() * 22), 1, 1, rnd() < .3 ? '#fff6c0' : '#ffffff'); px(96, 5, 5, 5, '#f6f0d0'); px(95, 6, 1, 3, '#f6f0d0'); px(101, 6, 1, 3, '#f6f0d0'); px(98, 5, 2, 2, '#e0d8b0'); }
  else { var sx = m === 'aube' ? 14 : m === 'soir' ? 92 : 88, sy = m === 'jour' ? 5 : 16; px(sx, sy, 7, 7, '#ffe48a'); px(sx - 1, sy + 1, 9, 5, '#ffe48a'); px(sx + 1, sy - 1, 5, 9, '#ffe48a'); px(sx + 2, sy + 2, 3, 3, '#fff6c8');
    if (m === 'jour') for (i = 0; i < 3; i++) { var cx = Math.floor(rnd() * 90), cy = 4 + Math.floor(rnd() * 9); px(cx, cy, 12, 2, '#ffffff'); px(cx + 3, cy - 2, 6, 2, '#ffffff'); px(cx + 1, cy + 2, 10, 1, '#e8f4fa'); } }
  // montagnes lointaines (marches de pixels), sommets enneigés
  var h = 16 + Math.floor(rnd() * 6);
  for (var x = 0; x < W; x++) { h += Math.floor(rnd() * 3) - 1; if (rnd() < .08) h += rnd() < .5 ? -3 : 3; h = Math.max(10, Math.min(26, h)); px(x, h, 1, 34 - h, t.loin); if (h < 17 || neige) px(x, h, 1, h < 14 ? 3 : 1, m === 'nuit' ? '#9aa6c0' : '#f4f6fa'); }
  // collines
  h = 30;
  for (x = 0; x < W; x++) { h += Math.floor(rnd() * 3) - 1; h = Math.max(26, Math.min(33, h)); px(x, h, 1, 44 - h, neige ? (m === 'nuit' ? '#8a96b0' : '#e8eef6') : t.mil); }
  // décor du lieu
  var mur = m === 'nuit' ? '#5a5048' : '#d9c9a8', toit = m === 'nuit' ? '#5a2a20' : '#b0392b', fen = m === 'nuit' || m === 'soir' ? '#ffd25a' : '#3b2a18';
  var maison = function (x, y) { px(x, y, 7, 5, mur); for (var k = 0; k < 4; k++) px(x - 1 + k, y - 1 - k, 9 - 2 * k, 1, toit); px(x + 2, y + 2, 2, 2, fen); px(x + 5, y + 3, 1, 2, '#3b2a18'); };
  var tour = function (x, y, hh) { px(x, y - hh, 6, hh, mur); for (var k = 0; k < 3; k++) px(x + k * 2, y - hh - 2, 1, 2, mur); px(x + 2, y - hh + 3, 2, 2, fen); px(x + 2, y - hh - 6, 1, 4, '#3b2a18'); px(x + 3, y - hh - 6, 3, 2, '#c0392b'); };
  if (theme === 'village') { maison(18, 32); maison(30, 33); maison(44, 31); tour(70, 36, 12); maison(86, 33); }
  else if (theme === 'ville') { for (i = 0; i < 7; i++) maison(8 + i * 15, 31 + (i % 2)); }
  else if (theme === 'chateau') { px(40, 22, 40, 14, mur); for (i = 0; i < 10; i++) px(40 + i * 4, 20, 2, 2, mur); tour(34, 36, 18); tour(80, 36, 18); tour(57, 22, 8); px(57, 29, 6, 7, '#3b2a18'); }
  else if (theme === 'tour') { tour(54, 36, 22); px(10, 35, 40, 1, '#8a6a3e'); px(66, 35, 44, 1, '#8a6a3e'); }
  else if (theme === 'lac') { px(0, 35, W, 5, m === 'nuit' ? '#1a2a50' : '#3f7fb0'); for (i = 0; i < 12; i++) px(Math.floor(rnd() * W), 36 + Math.floor(rnd() * 3), 3, 1, m === 'nuit' ? '#3a4a80' : '#a5d5ec'); maison(30, 31); }
  // sapins et sol
  for (i = 0; i < 9; i++) { var tx = Math.floor(rnd() * W), ty = 34 + Math.floor(rnd() * 3); px(tx, ty, 1, 3, '#3b2a18'); px(tx - 2, ty - 1, 5, 1, neige ? '#dfe8f0' : t.pres); px(tx - 1, ty - 3, 3, 2, neige ? '#dfe8f0' : t.pres); px(tx, ty - 5, 1, 2, t.pres); }
  px(0, 40, W, 4, neige ? (m === 'nuit' ? '#7a86a0' : '#f0f4f8') : t.sol);
  for (i = 0; i < 25; i++) px(Math.floor(rnd() * W), 40, 1, 1, neige ? '#ffffff' : t.pres);
  if (neige && m !== 'jour') for (i = 0; i < 25; i++) px(Math.floor(rnd() * W), Math.floor(rnd() * 38), 1, 1, '#ffffff');
  return '<div class="paysage" aria-hidden="true"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">' + r + '</svg></div>';
}

  var l = lundiDe(d); if (cocheesSemaine(h, l) < objectifSemaine(h)) l.setDate(l.getDate() - 7);
  while (cocheesSemaine(h, l) >= objectifSemaine(h)) { n++; l.setDate(l.getDate() - 7); }

// ---- la quête principale du jour : 3 candidates proposées ; à 10 h, sans choix, le Journal prend la première ----

    .sort(function (a, b) { return (b.gemmes ? b.gemmes / 10 : b.montant || 0) - (a.gemmes ? a.gemmes / 10 : a.montant || 0); })

// appelé par la liste des quêtes du jour : la quête principale passe en tête, avec le sceau d'or

// ---- l'écran du rituel ----

function gainXP_(xp, msg) {

function cocherMission_(nom, m, coche) {

// « Préparer le sac » le matin : déjà fait si le sac a été préparé la veille au crépuscule

// ---- petite fanfare quand un rituel est complet (25/11) ----
function sonFanfare_() {
  try {
    var m = sortie(.9); if (!m) return; var t = audio.currentTime + .05;
    function cuivre(fr, t0, dur, vol) {
      [1, 1.005].forEach(function (k) {

        g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .03); g.gain.setValueAtTime(vol, t0 + dur * .7); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
        o.connect(f); f.connect(g); g.connect(m); o.start(t0); o.stop(t0 + dur + .05);

    [0, .42, .9, .98, 1.02, 1.06].forEach(function (d, i) { timbale(t + d, i < 2 ? .35 : .25); });

  } catch (e) {}
}

// ---- sons des rituels accomplis (26/11) : cloches au loin à l'aube, chouette hulotte au crépuscule ----
function echoLointain_(m, retard, gain) { // écho de vallée pour éloigner le son

  d.delayTime.value = retard; g.gain.value = gain; f.type = 'lowpass'; f.frequency.value = 1800; e.gain.value = 1;
  e.connect(m); e.connect(d); d.connect(f); f.connect(g); g.connect(d); g.connect(m); return e;
}
function sonCloches_() { // angélus du matin (matines) : 3 × 3 coups du gros bourdon, puis la volée

    var lp = audio.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200; lp.connect(e);

      [[.5, .9, 7], [1, .7, 5], [1.2, .55, 4], [1.5, .3, 3], [2, .5, 3], [2.5, .15, 2], [3, .18, 1.6], [4.2, .08, 1]].forEach(function (p) {
        var o = audio.createOscillator(), g = audio.createGain(), d = p[2] * (long || 1); o.type = 'sine'; o.frequency.value = fr * p[0] * (1 + (Math.random() - .5) * .002);
        g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol * p[1], t0 + .006); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
        o.connect(g); g.connect(lp); o.start(t0); o.stop(t0 + d + .05);
      });

      gs.gain.setValueAtTime(vol * .6, t0); gs.gain.exponentialRampToValueAtTime(.0001, t0 + .05); s.connect(f); f.connect(gs); gs.connect(lp); s.start(t0);

}
function sonChouette_() {

    var m = sortie(.9); if (!m) return; var t = audio.currentTime + .05, e = echoLointain_(m, .45, .3);

      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .05); g.gain.setValueAtTime(vol, t0 + dur * .6); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      if (trem) { lf = audio.createOscillator(); lg = audio.createGain(); lf.frequency.value = 9; lg.gain.value = f0 * .03; lf.connect(lg); lg.connect(o.frequency); lf.start(t0); lf.stop(t0 + dur); }
      var s = bruit(dur), bp = audio.createBiquadFilter(), gs = audio.createGain(); bp.type = 'bandpass'; bp.frequency.value = f0; bp.Q.value = 6; // souffle
      gs.gain.setValueAtTime(.0001, t0); gs.gain.exponentialRampToValueAtTime(vol * .5, t0 + .05); gs.gain.exponentialRampToValueAtTime(.0001, t0 + dur);

// =================== FIABILITÉ ET PETITS PLAISIRS (25/11) ===================
// 1. Une quête validée ne revient plus. Cause : le Journal se recharge à chaque retour dans l'application ; si ce chargement
//    était parti avant que le serveur ait fini d'écrire, l'ancienne liste revenait. On retient donc 3 minutes ce qui vient d'être
//    validé, reporté ou retiré, et on le masque dans toute liste arrivée entre-temps (même la copie gardée au démarrage).
var EN_COURS = {};
try { EN_COURS = JSON.parse(localStorage.getItem('journal-en-cours') || '{}') || {}; } catch (e) {}
function retenir_(id, oui) {
  if (oui === false) delete EN_COURS[id]; else EN_COURS[id] = Date.now();

}
function filtrerEnCours_() {

  if (D.taches) D.taches = D.taches.filter(function (x) { return !EN_COURS['n' + x.n]; });
  if (D.aventure && D.aventure.quetes) {
    D.aventure.quetes = D.aventure.quetes.filter(function (q) { return !EN_COURS['x' + q.cle]; });
    D.aventure.quetes.forEach(function (q) { if (EN_COURS['c' + q.cle]) q.fait = true; });
  }
}
(function () {
  var origine = appel, marque = { appCocherTache: 'n', appIgnorerTache: 'n', appReporterTache: 'n', appAccomplirEvenement: 'c', appIgnorerEvenement: 'x' };

    var m = marque[fn], id = m && args && args.length ? m + args[0] : '';
    if (id) retenir_(id);
    return origine(fn, args, ok, function (e) { if (id) retenir_(id, false); if (ko) ko(e); });
  };
})();

// 2. Table rase : toutes les quêtes en retard rangées d'un coup (réglages ⚙️)
function tableRase_() {

function nqFermer_() { document.documentElement.classList.remove('saisie-ouverte'); try { $('nv-tache').blur(); } catch (x) {} }
function nqConfirmer_(t, o) {
  var xp = +(o && o.xp) || +(t && t.xp) || 10;

// Banale (10) : parchemin froissé
function nqFroisse_(ac) {
  var sr = ac.sampleRate, b = ac.createBuffer(1, Math.floor(sr * .55), sr), d = b.getChannelData(0);
  for (var k = 0; k < 26; k++) {
    var deb = Math.floor((Math.pow(Math.random(), 1.4) * .5) * sr), long = Math.floor((.006 + Math.random() * .025) * sr), amp = .3 + Math.random() * .7;
    for (var i = 0; i < long && deb + i < d.length; i++) d[deb + i] += (Math.random() * 2 - 1) * amp * Math.pow(1 - i / long, 2);
  }

  s.buffer = b; f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = .7; g.gain.value = .35;
  s.connect(f).connect(g).connect(ac.destination); s.start(ac.currentTime);
}
// Broutille (5) : deux traits de plume sur le parchemin
function nqPlume_(ac) {
  var sr = ac.sampleRate, b = ac.createBuffer(1, Math.floor(sr * .5), sr), d = b.getChannelData(0);

  });

  s.buffer = b; f.type = 'highpass'; f.frequency.value = 4500; g.gain.value = .28;
  s.connect(f).connect(g).connect(ac.destination); s.start(ac.currentTime);

// Cruciale (20) : froissé + lame qui tinte
function nqLame_(ac) {
  var t = ac.currentTime + .25;
  [1320, 1980, 2970].forEach(function (fq, k) {
    var o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = fq;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12 / (k + 1), t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + .9);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 1);

}
// Régalienne (30) : cor de chasse (appel en deux notes)
function nqCor_(ac) {
  var t0 = ac.currentTime, f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400; f.connect(ac.destination);
  [[0, .18, 349], [.2, .18, 349], [.42, .55, 523]].forEach(function (n) {

    o.connect(g).connect(f); o.start(t); o.stop(t + n[1] + .02);

// le petit parchemin du bouton « + » s'enroule et s'envole vers la liste des quêtes
function nqEnvol_() {
  try {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    var dx = (c.left + c.width / 2) - (r.left + r.width / 2), dy = Math.max(c.top, 70) + 60 - (r.top + r.height / 2);
    p.animate([
      { transform: 'translate(0,0) scale(1) rotate(0)', opacity: 1 },
      { transform: 'translate(0,-14px) scale(.7,1.1) rotate(-20deg)', opacity: 1, offset: .2 },
      { transform: 'translate(' + dx * .5 + 'px,' + (dy * .5 - 60) + 'px) scale(.8) rotate(200deg)', opacity: 1, offset: .6 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.4) rotate(360deg)', opacity: 0 }
    ], { duration: 900, easing: 'cubic-bezier(.4,0,.3,1)' }).onfinish = function () { p.remove(); };

}
