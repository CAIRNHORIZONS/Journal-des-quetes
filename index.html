<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Journal des quêtes</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#24180d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quêtes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=Comic+Neue:wght@700&family=Pixelify+Sans:wght@400;700&family=Silkscreen&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--fond:#f4f7fa;--carte:#fff;--texte:#1b2a3a;--doux:#5d6f82;--trait:#e1e8ef;--bleu:#1a7fa8;--bleu-clair:#e3f3f9;--rouge:#c8412c;--rouge-clair:#fdecea;--vert:#2f8f5b;--vert-clair:#e5f5ec;--orange:#b86e00;--orange-clair:#fff3df}
@media (prefers-color-scheme:dark){:root{--fond:#0f1720;--carte:#18232f;--texte:#e6edf3;--doux:#9aaabb;--trait:#26333f;--bleu:#4cb6dc;--bleu-clair:#123344;--rouge:#ff8a75;--rouge-clair:#3a1c17;--vert:#6fd19b;--vert-clair:#16352a;--orange:#f2b252;--orange-clair:#3a2c12}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fond);color:var(--texte);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--fond);padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;flex:1}
header small{color:var(--doux);font-size:12px}
.btn-ico{border:0;background:var(--carte);color:var(--texte);border-radius:12px;width:42px;height:42px;font-size:20px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{padding:0 12px 96px;max-width:760px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--carte);border-top:1px solid var(--trait);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--doux);padding:10px 4px 12px;font-size:13px;font-weight:600}
nav button b{display:block;font-size:20px;line-height:1.2;color:inherit}
nav button.actif{color:var(--bleu)}
.pastille{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--rouge);color:#fff;font-size:12px;line-height:20px;margin-left:4px}
.pastille:empty{display:none}
section.vue{display:none}section.vue.actif{display:block}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--doux);margin:18px 4px 8px;display:flex;justify-content:space-between}
.carte{background:var(--carte);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06);margin-bottom:8px;overflow:hidden}
.tache{display:flex;gap:12px;padding:12px 14px;align-items:flex-start;transition:opacity .3s,transform .3s}
.tache.fait{opacity:.35;transform:translateX(12px)}
.coche{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--bleu);background:none;margin-top:1px;position:relative}
.tache.fait .coche{background:var(--bleu)}
.tache.fait .coche::after{content:"✓";color:#fff;position:absolute;inset:0;display:grid;place-items:center;font-weight:700}
.corps{flex:1;min-width:0}
.titre{font-weight:500;word-wrap:break-word}
.tache.fait .titre{text-decoration:line-through}
.meta{font-size:13px;color:var(--doux);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:1px 8px;border-radius:8px;background:var(--bleu-clair);color:var(--bleu);font-size:12px;font-weight:600}
.tag.retard{background:var(--rouge-clair);color:var(--rouge)}
.tag.jour{background:var(--orange-clair);color:var(--orange)}
.notes{display:none;font-size:13px;color:var(--doux);margin-top:6px;white-space:pre-wrap}
.ouvert .notes{display:block}
details.avenir summary{cursor:pointer;color:var(--doux);font-size:14px;margin:16px 4px 8px;list-style:none}
details.avenir summary::before{content:"▸ "}details.avenir[open] summary::before{content:"▾ "}
.ajout{display:flex;gap:8px;margin:6px 0 4px}
.ajout input,.ajout select{font:inherit;border:1px solid var(--trait);background:var(--carte);color:var(--texte);border-radius:12px;padding:10px 12px}
.ajout input{flex:1;min-width:0}.ajout select{max-width:38%}
.ajout button,.actions button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 14px}
.plein{background:var(--bleu);color:#fff}.vert{background:var(--vert);color:#fff}.gris{background:var(--trait);color:var(--texte)}.rougeb{background:var(--rouge-clair);color:var(--rouge)}
.sms{padding:12px 14px}
.sms textarea{width:100%;min-height:110px;font:inherit;font-size:15px;border:1px solid var(--trait);border-radius:10px;padding:10px;background:var(--fond);color:var(--texte);margin:8px 0;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}
.vide{text-align:center;color:var(--doux);padding:36px 12px}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:#1b2a3a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%)}
.chargement{text-align:center;color:var(--doux);padding:40px}
a{color:var(--bleu)}
.saisie{padding:12px;margin-top:4px}
.saisie textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--trait);border-radius:12px;padding:10px 12px;background:var(--fond);color:var(--texte);resize:none}
.saisie .ajout{margin:8px 0 0}.saisie select{flex:1;min-width:0;max-width:none}.saisie #nv-ok{flex:none}
.micro{flex:none;width:46px;border:0;border-radius:12px;background:var(--bleu-clair);font-size:20px}
.micro.ecoute{background:var(--rouge);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
.aide{font-size:12px;color:var(--doux);margin-top:8px}
.tache textarea{width:100%;min-height:96px;font:inherit;font-size:15px;border:1px solid var(--trait);border-radius:10px;padding:10px;background:var(--fond);color:var(--texte);margin:8px 0 0}
.choix{margin-top:10px}.choix button{padding:9px 10px}
.citation{margin-top:8px;padding:8px 10px;border-left:3px solid var(--bleu);background:var(--bleu-clair);border-radius:6px;font-size:14px}
.a-choix .corps{cursor:default}

/* ====== Thème « Journal des quêtes » (parchemin, encre, cire) ====== */
:root{--fond:#e9dcbf;--carte:#f6ecd2;--texte:#2b1d10;--doux:#6e5536;--trait:#b99a6a;--bleu:#7a4a12;--bleu-clair:#ecdcb4;--rouge:#8e1c14;--rouge-clair:#f1d3c4;--vert:#3c5a2a;--vert-clair:#dfe5c6;--orange:#8a5a00;--orange-clair:#f3e1b0;--or:#b8862b;--encre:#2b1d10}
@media (prefers-color-scheme:dark){:root{--fond:#17110b;--carte:#2a1f14;--texte:#f0e2c2;--doux:#c3a87c;--trait:#5b4429;--bleu:#e0b25a;--bleu-clair:#3a2b18;--rouge:#e0715e;--rouge-clair:#3b1a14;--vert:#9cbf6e;--vert-clair:#25301a;--orange:#f0b955;--orange-clair:#3b2c12;--or:#d9a441;--encre:#f0e2c2}}
html,body{font-family:"EB Garamond",Georgia,serif;font-size:17px;
  background-color:var(--fond);
  background-image:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.35),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(90,55,20,.18),transparent 55%),repeating-linear-gradient(0deg,rgba(80,50,20,.025) 0 2px,transparent 2px 5px)}
header{background:linear-gradient(var(--fond) 70%,transparent);border-bottom:0}
header h1{font-family:"Cinzel",Georgia,serif;font-weight:700;letter-spacing:.06em;font-size:21px;color:var(--encre)}
header h1::before{content:"❦ ";color:var(--or)}
.btn-ico{background:var(--carte);border:1px solid var(--trait);color:var(--bleu)}
h2{font-family:"Cinzel",Georgia,serif;text-transform:none;letter-spacing:.05em;font-size:15px;color:var(--bleu);align-items:center;gap:10px;margin:22px 4px 10px}
h2 span:first-child{flex:none}
h2::after{content:"";order:1;flex:1;height:1px;background:linear-gradient(90deg,var(--or),transparent)}
h2 span:last-child{order:2;font-family:"EB Garamond",serif;color:var(--doux)}
h2 span:first-child::before{content:"✦ ";color:var(--or)}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:6px;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 2px 6px rgba(60,35,10,.18);position:relative}
.carte::before{content:"";position:absolute;inset:3px;border:1px solid rgba(160,120,60,.35);border-radius:4px;pointer-events:none}
.titre{font-size:17px;font-weight:500;color:var(--encre)}
.coche{width:32px;height:32px;border:2px solid var(--or);background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.35),transparent 60%)}
.tache.fait .coche{background:radial-gradient(circle at 35% 30%,#c0473a,#7d140d 70%);border-color:#5e0f0a;box-shadow:0 0 0 3px rgba(125,20,13,.25)}
.tache.fait .coche::after{content:"⚜";font-size:16px}
.tache.fait .titre{text-decoration:line-through;text-decoration-color:var(--rouge)}
.tag{border-radius:3px;font-family:"Cinzel",serif;font-weight:600;font-size:11px;letter-spacing:.03em;border:1px solid currentColor;background:transparent}
.tag.retard{background:transparent}.tag.jour{background:transparent}
.plein{background:linear-gradient(#a8742a,#7a4a12);color:#fff7e3;border:1px solid #5b350c!important;font-family:"Cinzel",serif;letter-spacing:.04em}
.vert{background:linear-gradient(#557a3c,#33502a);color:#f6ecd2;border:1px solid #243a1c!important;font-family:"Cinzel",serif}
.gris{background:transparent;color:var(--texte);border:1px solid var(--trait)!important;font-family:"Cinzel",serif}
.rougeb{background:transparent;color:var(--rouge);border:1px solid var(--rouge)!important;font-family:"Cinzel",serif}
.saisie textarea,.sms textarea,.tache textarea,.ajout select{background:rgba(255,250,235,.55);border:1px solid var(--trait);border-radius:4px;font-family:"EB Garamond",serif;font-size:17px;color:var(--texte)}
@media (prefers-color-scheme:dark){.saisie textarea,.sms textarea,.tache textarea,.ajout select{background:rgba(0,0,0,.25)}}
.saisie textarea::placeholder{font-style:italic;color:var(--doux)}
.micro{background:var(--bleu-clair);border:1px solid var(--trait)}
.citation{border-left:3px solid var(--or);background:transparent;font-style:italic}
.notes{font-style:italic}
.vide{font-family:"Cinzel",serif;font-size:15px;color:var(--doux);line-height:1.6}
.vide::before{content:"❧";display:block;font-size:30px;color:var(--or);margin-bottom:4px}
details.avenir summary{font-family:"Cinzel",serif;color:var(--bleu)}
nav{background:linear-gradient(#3b2a18,#24180d);border-top:2px solid var(--or)}
nav button{color:#cdb68a;font-family:"Cinzel",serif;letter-spacing:.04em;font-size:12px}
nav button.actif{color:#f3d58b;text-shadow:0 0 8px rgba(243,213,139,.5)}
.pastille{background:#8e1c14;border:1px solid #f3d58b;font-family:"EB Garamond",serif}
#toast{background:#2b1d10;color:#f3d58b;border:1px solid var(--or);font-family:"Cinzel",serif;border-radius:4px}

.banniere{margin:2px 0 6px;border-radius:6px;overflow:hidden;box-shadow:0 2px 8px rgba(60,35,10,.25);position:relative}
.banniere svg{display:block;width:100%;height:96px}
.devise{position:absolute;left:0;right:0;bottom:0;padding:3px 6px 4px;background:linear-gradient(transparent,rgba(30,20,10,.75));text-align:center;font-family:"Cinzel",serif;font-size:11px;letter-spacing:.06em;color:#f6ecd2;text-shadow:0 1px 2px #000}
body:not(.v-taches) .banniere{display:none}

.renommee{background:var(--carte);border:1px solid var(--trait);border-radius:6px;padding:10px 12px;margin:2px 0 10px;box-shadow:0 2px 6px rgba(60,35,10,.18);transition:transform .3s}
.renommee.pulse{transform:scale(1.02);box-shadow:0 0 0 2px var(--or),0 0 18px rgba(216,164,65,.6)}
body:not(.v-taches) .renommee{display:none}
.rang{display:flex;gap:10px;align-items:center}
.rang b{font-family:"Cinzel",serif;font-size:15px;color:var(--bleu);display:block}
.rang small{color:var(--doux);font-size:13px}
.blason{flex:none;width:38px;height:42px;display:grid;place-items:center;font-family:"Cinzel",serif;font-weight:700;color:#f6ecd2;background:linear-gradient(#a8742a,#6e3f0e);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);text-shadow:0 1px 1px #000}
.jauge{height:8px;margin-top:8px;border-radius:4px;background:rgba(120,80,30,.18);overflow:hidden;border:1px solid var(--trait)}
.jauge i{display:block;height:100%;background:linear-gradient(90deg,#b8862b,#f3d58b);transition:width .8s ease}
.chapitre{position:relative;margin:20px 0 10px;border-radius:6px;overflow:hidden;box-shadow:0 2px 8px rgba(60,35,10,.28);border:1px solid #5b350c}
.chapitre svg{display:block;width:100%;height:84px}
.chapitre-titre{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:end;padding:14px 12px 6px;background:linear-gradient(transparent,rgba(25,15,5,.8))}
.chapitre-titre span{font-family:"Cinzel",serif;font-weight:700;letter-spacing:.06em;color:#f6ecd2;text-shadow:0 1px 2px #000}
.chapitre-titre span::before{content:"✦ ";color:#f3d58b}
.chapitre-titre b{font-family:"Cinzel",serif;color:#f3d58b;font-size:14px}
.tache{position:relative;overflow:visible}
.tache.embrase{animation:brule 1.3s ease-in forwards}
.tache.embrase .coche{border-color:#ffb02e;background:radial-gradient(circle at 50% 60%,#fff3b0,#ff9a2e 45%,#c0331a 80%);box-shadow:0 0 14px 6px rgba(255,140,40,.65)}
@keyframes brule{0%{}25%{box-shadow:0 0 0 1px #ffb02e,0 0 22px rgba(255,130,30,.55),inset 0 0 26px rgba(255,140,40,.35)}70%{opacity:.9;filter:sepia(.6) brightness(.9)}100%{opacity:0;filter:sepia(1) brightness(.45);transform:translateY(-4px) scale(.97)}}
.feu{position:absolute;width:0;height:0;pointer-events:none;z-index:3}
.fl{position:absolute;left:-9px;bottom:-6px;width:18px;height:30px;border-radius:50% 50% 45% 45%/62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 78%,#fff6c2 0,#ffc53d 30%,#ff7a1a 58%,rgba(210,50,20,.85) 75%,transparent 80%);transform-origin:50% 100%;filter:blur(.4px);mix-blend-mode:screen;animation:flamme 1s ease-out forwards}
.f2{left:-15px;width:13px;height:22px;animation-delay:.07s}.f3{left:2px;width:12px;height:20px;animation-delay:.12s}
@keyframes flamme{0%{transform:scale(.2,.1);opacity:0}15%{opacity:1}35%{transform:scale(1.1,1.25) skewX(-6deg)}55%{transform:scale(.9,1.45) skewX(6deg)}80%{transform:scale(.7,1.6) translateY(-6px);opacity:.8}100%{transform:scale(.3,1.8) translateY(-14px);opacity:0}}
.br{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffcf6b;box-shadow:0 0 6px #ff8a1a;left:0;top:0;opacity:0;animation:braise 1.2s ease-out forwards}
.b1{--x:-16px;animation-delay:.15s}.b2{--x:12px;animation-delay:.25s}.b3{--x:-4px;animation-delay:.35s}.b4{--x:20px;animation-delay:.2s}
@keyframes braise{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),-46px)}}
.xp-flottant{position:absolute;right:14px;top:8px;font-family:"Cinzel",serif;font-weight:700;color:var(--or);text-shadow:0 1px 0 #000;animation:xp 1.2s ease-out forwards;pointer-events:none}
@keyframes xp{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.rang-txt{flex:1;min-width:0}
.semaine{flex:none;display:flex;align-items:flex-end;gap:3px;height:34px;width:70px}
.semaine i{flex:1;background:rgba(184,134,43,.45);border-radius:2px 2px 0 0}
.semaine i.auj{background:linear-gradient(#f3d58b,#b8862b)}
.jauge{position:relative}
.repere{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--rouge);box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.conseil{margin-top:6px;font-size:13px;font-style:italic;color:var(--doux)}

.renommee-corps{display:flex;gap:10px;align-items:stretch}
.renommee-gauche{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.epee{flex:none;width:44px;height:146px;align-self:center;filter:drop-shadow(0 2px 2px rgba(40,20,5,.35))}
.flammeche{animation:flammeche .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flammeche{from{transform:scaleY(1)}to{transform:scaleY(1.3) skewX(-6deg)}}
.semaine{display:flex;gap:5px;height:auto;width:auto;align-items:flex-end}
.semaine .jour{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.semaine .jour{height:46px;justify-content:flex-end}
.semaine .jour i{display:block;width:100%;max-width:22px;flex:none;background:rgba(184,134,43,.45);border-radius:2px 2px 0 0}
.semaine .jour.auj i{background:linear-gradient(#f3d58b,#b8862b)}
.semaine .jour.futur i{background:none}
.semaine .jour em{font-style:normal;font-family:"Cinzel",serif;font-size:10px;color:var(--doux)}
.semaine .jour.auj em{color:var(--bleu);font-weight:700}
.cap{font-size:14px;color:var(--texte);border-top:1px dashed var(--trait);padding-top:6px}
.cap b{font-family:"Cinzel",serif;color:var(--bleu)}

.chapitres{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
@media(min-width:600px){.chapitres{grid-template-columns:1fr 1fr 1fr}}
.tuile{position:relative;display:block;padding:0;border:2px solid #7a4a12;border-radius:8px;overflow:hidden;background:#2b1d10;cursor:pointer;box-shadow:0 2px 6px rgba(40,20,5,.3);text-align:left;font:inherit}
.tuile svg{display:block;width:100%;height:84px}
.tuile-nom{display:block;padding:6px 8px 7px;font-family:"Cinzel",serif;font-weight:700;font-size:12.5px;letter-spacing:.03em;color:#f6ecd2;background:linear-gradient(#3b2a18,#24180d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:34px}
.tuile-nb{position:absolute;right:6px;bottom:5px;min-width:22px;height:22px;border-radius:11px;background:#b8862b;color:#24180d;font-family:"Cinzel",serif;font-weight:700;font-size:13px;display:grid;place-items:center}
.tuile-retard{position:absolute;top:6px;right:6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#8e1c14;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:1px solid #f3d58b}
.tuile.vide-ch{opacity:.5;filter:saturate(.6)}
.tuile:active{transform:scale(.97)}
.aide.centre{text-align:center;margin:4px 0 14px}
.chapitre-ouvert{position:sticky;top:58px;z-index:4;margin:12px 0 6px;border:2px solid #7a4a12;border-radius:8px;overflow:hidden;cursor:pointer;box-shadow:0 4px 12px rgba(40,20,5,.35)}
.chapitre-ouvert svg{display:block;width:100%;height:84px}
.chapitre-ouvert .chapitre-titre{padding-left:34px;padding-right:44px}
.chapitre-ouvert .fleche{position:absolute;top:50%;transform:translateY(-50%);font-style:normal;font-size:28px;color:#f6ecd2;text-shadow:0 1px 3px #000;width:30px;text-align:center}
.chapitre-ouvert .fleche.g{left:2px}.chapitre-ouvert .fleche.d{right:2px}
.chapitre-ouvert .fermer{position:absolute;top:6px;right:8px;font-style:normal;font-size:13px;color:#f6ecd2;background:rgba(20,12,4,.55);border-radius:10px;padding:1px 7px}
.points{display:flex;justify-content:center;gap:5px;margin:2px 0 10px}
.points i{width:6px;height:6px;border-radius:3px;background:var(--trait)}.points i.on{width:16px;background:var(--or)}
#liste-quetes{transition:transform .16s ease,opacity .16s ease}
#liste-quetes.sort-g{transform:translateX(-40px);opacity:0}#liste-quetes.sort-d{transform:translateX(40px);opacity:0}
#liste-quetes.entre-d{animation:entreD .2s ease}#liste-quetes.entre-g{animation:entreG .2s ease}
@keyframes entreD{from{transform:translateX(40px);opacity:0}}@keyframes entreG{from{transform:translateX(-40px);opacity:0}}
.tache.soulevee{opacity:.35}
.fantome{position:fixed;z-index:20;pointer-events:none;transform:translate(-50%,-120%) rotate(-2deg);max-width:70vw;padding:8px 12px;border-radius:6px;background:var(--carte);border:2px solid var(--or);box-shadow:0 8px 20px rgba(0,0,0,.35);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barre-depot{position:fixed;left:0;right:0;top:0;z-index:19;display:flex;flex-wrap:wrap;gap:6px;padding:10px 10px 12px;background:linear-gradient(#24180d,#3b2a18);border-bottom:2px solid var(--or);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.barre-titre{width:100%;font-family:"Cinzel",serif;font-size:12px;color:#f3d58b;margin-bottom:2px}
.depot{padding:8px 10px;border-radius:6px;border:1px solid #b8862b;color:#f6ecd2;font-family:"Cinzel",serif;font-size:12px;background:rgba(255,255,255,.06)}
.depot.vise{background:#b8862b;color:#24180d;transform:scale(1.06)}
.deplacer-zone{display:none;margin-top:8px;font-size:13px;color:var(--doux)}
.tache.ouvert .deplacer-zone{display:block}
.deplacer{font:inherit;font-size:13px;border:1px solid var(--trait);border-radius:4px;background:var(--carte);color:var(--texte);padding:4px 6px}
.tache{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tuile-nom{white-space:normal;line-height:1.2;min-height:38px;display:flex;align-items:center;font-size:12px}

.tuile,.chapitre-ouvert,.chapitre{position:relative}
.peinture{position:absolute;left:0;right:0;top:0;width:100%;height:84px;object-fit:cover;display:block}
.chapitre-ouvert .chapitre-titre,.chapitre-ouvert .fleche,.chapitre-ouvert .fermer{z-index:2}
.chapitre-ouvert .chapitre-titre{position:absolute;left:0;right:0;bottom:0}
.tuile-nb,.tuile-retard{z-index:2}

nav button{font-size:11px;padding-left:2px;padding-right:2px}
.presage .titre{font-size:17px}
.corriger{margin:8px 0 2px;font-size:14px}
.corriger summary{cursor:pointer;color:var(--bleu);font-family:"Cinzel",serif;font-size:12px}
.corriger label{display:block;margin-top:6px;font-size:13px;color:var(--doux)}
.corriger input{display:block;width:100%;font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--trait);border-radius:4px;background:var(--fond);color:var(--texte)}
.corriger .heures{display:flex;gap:8px}.corriger .heures label{flex:1}
.presage .actions{margin-top:8px}

.dates-zone{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:8px}
.dates-zone label{flex:1;min-width:120px;font-size:12px;color:var(--doux);font-family:"Cinzel",serif}
.dates-zone input{display:block;width:100%;font:inherit;font-size:15px;padding:5px 6px;border:1px solid var(--trait);border-radius:4px;background:var(--fond);color:var(--texte)}
.dates-zone button{flex:none}
.horizon{display:block;width:100%;margin:4px 0 10px;padding:12px 14px;border:2px solid #7a4a12;border-radius:8px;background:linear-gradient(#3b2a18,#24180d);color:#f6ecd2;font-family:"Cinzel",serif;font-weight:700;font-size:14px;text-align:left;cursor:pointer}
.horizon b{float:right;min-width:22px;height:22px;border-radius:11px;background:#b8862b;color:#24180d;display:inline-grid;place-items:center;font-size:13px}
.horizon small{display:block;font-family:"EB Garamond",serif;font-weight:400;font-size:13px;opacity:.8;margin-top:2px}
.horizon-tete{display:flex;align-items:center;gap:10px;margin:12px 2px 6px}
.horizon-tete h3{flex:1;margin:0;font-family:"Cinzel",serif;font-size:17px}
.horizon-tete button{border:1px solid var(--trait);background:var(--carte);color:var(--texte);border-radius:6px;padding:6px 12px;font:inherit}
.tag.chap{background:transparent;border:1px solid currentColor}

/* ====== Rangs : charte propre à chaque niveau ====== */
:root{--plein1:#a8742a;--plein2:#7a4a12;--nav1:#3b2a18;--nav2:#24180d}
.plein{background:linear-gradient(var(--plein1),var(--plein2))}
nav{background:linear-gradient(var(--nav1),var(--nav2))}
:root[data-rang="1"]{--or:#a5602a;--bleu:#4a4a52;--plein1:#6d6f75;--plein2:#3c3e43;--nav1:#3a3a40;--nav2:#1f1f23}
:root[data-rang="3"]{--or:#8fa3b8;--bleu:#2c4f86;--plein1:#3f6aa8;--plein2:#22406e;--nav1:#20304a;--nav2:#121c2e}
:root[data-rang="4"]{--or:#d29a1c;--bleu:#8e1c14;--plein1:#c0391b;--plein2:#7d140d;--nav1:#4a1610;--nav2:#240a06}
:root[data-rang="5"]{--or:#9b6be0;--bleu:#5a2ea0;--plein1:#7b4fd0;--plein2:#45227f;--nav1:#2b1748;--nav2:#150a26}
@media (prefers-color-scheme:dark){:root[data-rang="1"]{--or:#d98a4a;--bleu:#d6d0c8}:root[data-rang="3"]{--or:#b9c8d8;--bleu:#9fbfeb}:root[data-rang="4"]{--or:#f0bf4c;--bleu:#ef8a6a}:root[data-rang="5"]{--or:#c9a2ff;--bleu:#c9a8ff}}
:root[data-rang="5"] body{background-image:radial-gradient(ellipse at 20% 0%,rgba(190,150,255,.28),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(90,40,160,.18),transparent 55%),repeating-linear-gradient(0deg,rgba(80,50,20,.025) 0 2px,transparent 2px 5px)}
:root[data-rang="4"] .renommee{box-shadow:0 2px 10px rgba(200,60,20,.25)}
.blason-svg{flex:none;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.blason-svg svg{display:block;width:100%;height:auto;overflow:visible}
.blason-svg.r1{width:38px}.blason-svg.r2{width:42px}.blason-svg.r3{width:44px}.blason-svg.r4{width:56px}.blason-svg.r5{width:66px}
.epee{width:44px;height:154px}
.epee .vif{animation:vif .35s ease-in-out infinite alternate}.epee .halo{animation:vif2 .6s ease-in-out infinite alternate}
@keyframes vif{from{opacity:.05}to{opacity:.35}}@keyframes vif2{from{opacity:.4}to{opacity:.7}}
.tache.embrase{animation:none}
:root:not([data-rang="4"]) .tache.embrase .coche{background:none;box-shadow:none}
:root[data-rang="5"] .tache.embrase .coche{border-color:#c9a2ff;box-shadow:0 0 12px 4px rgba(164,107,255,.7)}
.part{position:fixed;z-index:41;pointer-events:none;border-radius:50%;display:block}
.front-feu{position:fixed;height:0;z-index:41;pointer-events:none}
.front-feu .lang{position:absolute;bottom:-6px;transform:translateX(-50%);transform-origin:50% 100%;border-radius:50% 50% 45% 45%/62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 80%,#fff6c2 0,#ffc53d 28%,#ff7a1a 55%,rgba(210,50,20,.85) 72%,transparent 78%);mix-blend-mode:screen;filter:blur(.5px);animation:lecher .3s ease-in-out infinite alternate}
@keyframes lecher{from{transform:translateX(-50%) scale(.9,.85) skewX(-5deg)}to{transform:translateX(-50%) scale(1.1,1.2) skewX(5deg)}}
.braise-ligne{position:absolute;left:0;right:0;top:-3px;height:7px;background:linear-gradient(90deg,#3a1a08,#ff7a1a,#ffcf6b,#ff7a1a,#3a1a08);filter:blur(1px);box-shadow:0 0 12px #ff7a1a}
/* Le tableau ouvert ne recouvre plus les quêtes : il défile avec la page, son nom reste dans l'en-tête */
.chapitre-ouvert{position:relative;top:auto;z-index:1}
header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.presage .q-dates{margin-top:4px}
.rapport{border-color:var(--or)}
.rapport-txt{white-space:pre-wrap;font-size:15px;margin-top:6px;line-height:1.45}

.principales{margin:10px 0 4px}
.tache.principale{border:2px solid var(--or);box-shadow:0 0 0 3px rgba(216,164,65,.22),0 4px 14px rgba(120,70,10,.28);background:linear-gradient(var(--carte),var(--orange-clair))}
.tache.principale .titre{font-family:"Cinzel",serif;font-weight:700;font-size:17px}
.tag.epique{color:#8a5a00;border-color:#b8862b;background:#f6e2a6}
@media (prefers-color-scheme:dark){.tag.epique{color:#f3d58b;background:#3a2c12}}
.q-zone{margin-top:10px;padding:8px 10px;border:1px dashed var(--trait);border-radius:6px}
.q-zone>span{font-family:"Cinzel",serif;font-size:12px;color:var(--bleu)}
.q-zone .heures{display:flex;gap:8px}.q-zone label{flex:1;display:block;margin-top:4px;font-size:13px;color:var(--doux)}
.q-zone input{display:block;width:100%;font:inherit;font-size:15px;padding:5px 6px;border:1px solid var(--trait);border-radius:4px;background:var(--fond);color:var(--texte)}
.sms.envoye{opacity:.85}

.tache.principale .titre{font-family:"Cinzel",serif;font-weight:700;font-size:19px;line-height:1.25;color:#2b1d10}
.tache.principale .meta{justify-content:center}
.tache.principale .tag{color:#5e1a10;border-color:#5e1a10}
.tache.principale .corps::after{content:"Récompense : " attr(data-xp) " XP";display:block;margin-top:10px;font-family:"Cinzel",serif;font-weight:700;font-size:14px;letter-spacing:.06em;color:#7a4a12}
.tache.principale .deplacer-zone{text-align:left}
.principales .etapes{margin-left:6px;border-left-color:#f3d58b}
.principales .tache.etape{transform:rotate(.3deg)}
/* ====== Missives : pigeon voyageur ; messager revenu : cavalier égaré ====== */
.sms.carte:not(.envoye){background-image:linear-gradient(color-mix(in srgb,var(--carte) 84%,transparent),color-mix(in srgb,var(--carte) 84%,transparent)),url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 80%22%3E%3Cg fill=%22%236b4a2a%22 fill-opacity=%22.16%22%3E%3Cellipse cx=%2262%22 cy=%2244%22 rx=%2226%22 ry=%2215%22/%3E%3Ccircle cx=%2288%22 cy=%2232%22 r=%229%22/%3E%3Cpath d=%22M96 31 l9 3 l-9 3 z%22/%3E%3Cpath d=%22M40 40 q-22 -30 -36 -26 q14 6 22 22 z%22/%3E%3Cpath d=%22M48 38 q-10 -26 4 -34 q2 16 12 28 z%22/%3E%3Cpath d=%22M38 48 l-26 10 l6 -12 z%22/%3E%3C/g%3E%3Cg stroke=%22%236b4a2a%22 stroke-opacity=%22.2%22 stroke-width=%222%22 fill=%22none%22%3E%3Cpath d=%22M62 58 v10 M70 58 v10%22/%3E%3C/g%3E%3Crect x=%2264%22 y=%2262%22 width=%2214%22 height=%226%22 rx=%223%22 fill=%22%23c8a46a%22 fill-opacity=%22.35%22 stroke=%22%236b4a2a%22 stroke-opacity=%22.25%22/%3E%3C/svg%3E");
  background-size:cover,cover,150px auto;background-position:center,center,right 8px top 8px;background-repeat:no-repeat}
.sms.carte.revenu{background-image:linear-gradient(color-mix(in srgb,var(--carte) 82%,transparent),color-mix(in srgb,var(--carte) 82%,transparent)),url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 160 100%22%3E%3Cg fill=%22%235b3d22%22 fill-opacity=%22.15%22%3E%3Cpath d=%22M40 52 q4 -12 24 -12 h26 q10 0 12 8 l6 -10 q6 -2 8 4 l-6 8 q-2 10 -12 10 h-34 q-18 0 -24 -8 z%22/%3E%3Cpath d=%22M48 60 l-4 18 M58 60 l2 18 M86 60 l-2 18 M96 58 l4 18%22 stroke=%22%235b3d22%22 stroke-opacity=%22.18%22 stroke-width=%223%22/%3E%3Cpath d=%22M66 40 q-2 -14 6 -18 q8 4 6 18 z%22/%3E%3Ccircle cx=%2272%22 cy=%2217%22 r=%225%22/%3E%3Cpath d=%22M64 26 q-12 8 -16 20 l8 -2 q4 -10 10 -14 z%22/%3E%3C/g%3E%3Cg stroke=%22%235b3d22%22 stroke-opacity=%22.14%22 fill=%22none%22%3E%3Cpath d=%22M0 86 h160 M0 94 h160 M20 86 v8 M50 86 v8 M80 86 v8 M110 86 v8 M140 86 v8 M35 94 v6 M65 94 v6 M95 94 v6 M125 94 v6%22/%3E%3C/g%3E%3C/svg%3E");
  background-size:cover,cover,190px auto;background-position:center,center,right 6px bottom 6px}
.depot-princ{border-color:#f3d58b!important;color:#f3d58b!important}

.missive-zone{margin-top:10px}
.missive-zone>span{display:block;font-family:"Cinzel",serif;font-size:12px;color:var(--bleu);margin-bottom:4px}
.missive-zone textarea{width:100%;min-height:150px;font:inherit;font-size:15px;line-height:1.4;padding:10px;border:1px solid var(--trait);border-radius:8px;background:#fff;color:#2b1d10}
.missive-zone .dest{font-size:13px;color:var(--doux);margin-top:4px}

.trou .cand{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--trait);border-radius:10px;margin:6px 0;cursor:pointer;background:color-mix(in srgb,var(--carte) 70%,transparent)}
.trou .cand .ordre{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--bleu);display:grid;place-items:center;font-weight:700;color:var(--bleu)}
.trou .cand.choisi .ordre{background:var(--bleu);color:#fff}
.trou .cand .qui{flex:1;min-width:0}
.trou .cand small{display:block;color:var(--doux);font-size:13px}
.trou .cand .effet{color:#2f7a3a;font-weight:600;font-size:13px}
.trou .cand details{margin-top:4px}.trou .cand summary{font-size:13px;color:var(--bleu)}
.trou .cand textarea{width:100%;min-height:100px;font:inherit;font-size:14px;padding:8px;border:1px solid var(--trait);border-radius:8px;background:#fff;color:#2b1d10}
.trou .journal-trou{font-size:13px;color:var(--doux);white-space:pre-line;margin-top:6px}
.missive-zone .objet{display:block;font-size:13px;color:var(--doux);margin:6px 0 0}.missive-zone .objet input{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--trait);border-radius:8px;background:#fff;color:#2b1d10}

/* ====== Aujourd'hui : tableau de bord ====== */
.jour-date{font-family:"Cinzel",serif;font-size:15px;color:var(--doux);margin:2px 2px 8px}
.chiffres .ch-titre,.agenda-jour .ch-titre,.quetes-jour .ch-titre,.impayes .ch-titre{font-family:"Cinzel",serif;font-weight:700;color:var(--encre);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ch-grille{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ch{background:color-mix(in srgb,var(--carte) 70%,#fff);border:1px solid var(--trait);border-radius:8px;padding:8px 6px;text-align:center;line-height:1.15}
.ch b{display:block;font-family:"Cinzel",serif;font-size:19px;color:var(--encre)}
.ch span{font-size:11.5px;color:var(--doux)}
.ch.alerte b{color:#a2321f}
.jauge{display:block;height:5px;border-radius:3px;background:var(--trait);margin-top:5px;overflow:hidden}.jauge u{display:block;height:100%;background:#2f7a3a}.jauge.trop u{background:#a2321f}
.puces{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.puce{font:inherit;font-size:14px;border:1px solid var(--trait);background:var(--carte);color:var(--encre);border-radius:999px;padding:7px 12px;box-shadow:0 1px 3px rgba(60,35,10,.15)}
.onglet{font:inherit;font-family:"Cinzel",serif;font-size:13px;border:1px solid var(--trait);background:transparent;color:var(--doux);border-radius:999px;padding:3px 10px}
.onglet.actif{background:var(--encre);color:var(--carte);border-color:var(--encre)}
.ev{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--trait)}
.ev:first-of-type{border-top:0}
.ev.passe{opacity:.45}
.ev-h{flex:0 0 46px;font-weight:700;color:var(--encre);font-size:14px;line-height:1.1}.ev-h small{display:block;font-weight:400;color:var(--doux);font-size:12px}
.ev-t{flex:1;min-width:0;font-size:14.5px}.ev-t small{display:block;color:var(--doux);font-size:12px}
.ev-a{font-size:11px;border-radius:999px;padding:1px 7px;border:1px solid var(--trait);color:var(--doux);white-space:nowrap}
.ag-natation .ev-a{color:#1f5f8a;border-color:#1f5f8a}.ag-prodémial .ev-a{color:#6b3fa0;border-color:#6b3fa0}.ag-perso .ev-a{color:#2f7a3a;border-color:#2f7a3a}
.qj{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--trait)}
.qj:first-of-type{border-top:0}
.qj .coche{position:static;flex:0 0 auto;margin:0}
.qj-t{flex:1;font-size:14.5px}.qj-t small{display:block;color:var(--doux);font-size:12px}.qj-t em{color:#a2321f;font-style:normal}
.lien-vue{margin-left:auto;font:inherit;font-size:13px;background:none;border:0;color:var(--doux)}
.imp{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--trait)}
.imp:first-of-type{border-top:0}
.imp-n{flex:1;min-width:0;font-size:14.5px}.imp b{color:#a2321f}
.imp button{font:inherit;font-size:13px;padding:4px 10px}
.chiffres,.agenda-jour,.quetes-jour,.impayes{padding:10px 12px}
.missive-zone .objet select{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--trait);border-radius:8px;background:#fff;color:#2b1d10}
.avert-mail{font-size:12.5px;color:#a2321f;margin-top:4px}

/* ====== Fiche client ====== */
.voile-fiche{position:fixed;inset:0;z-index:60;background:rgba(20,10,0,.45);display:flex;align-items:flex-end;justify-content:center}
.fiche{position:relative;background:var(--fond);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 14px 28px;box-shadow:0 -6px 24px rgba(0,0,0,.35)}
.fermer-fiche{position:absolute;right:10px;top:10px;border:1px solid var(--trait);background:var(--carte);border-radius:50%;width:34px;height:34px;font-size:16px;color:var(--encre)}
.f-nom{font-family:"Cinzel",serif;font-size:21px;font-weight:700;color:var(--encre);padding-right:40px}
.f-sous{color:var(--doux);font-size:13.5px;margin:2px 0 10px}
.f-chiffres{display:flex;gap:8px;margin-bottom:10px}.f-chiffres span{flex:1;text-align:center;background:var(--carte);border:1px solid var(--trait);border-radius:8px;padding:6px;font-size:12.5px;color:var(--doux)}
.f-chiffres b{display:block;font-size:17px;color:var(--encre)}.f-chiffres .rouge b{color:#a2321f}
.f-actions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.f-bt{font:inherit;font-size:13.5px;text-decoration:none;border:1px solid var(--trait);background:var(--carte);color:var(--encre);border-radius:999px;padding:7px 11px}
.f-bloc{background:var(--carte);border:1px solid var(--trait);border-radius:8px;padding:8px 10px;margin:8px 0}
.f-bloc h4{margin:0 0 6px;font-family:"Cinzel",serif;font-size:14px;color:var(--encre)}
.fs{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px;font-size:13px;padding:4px 0;border-top:1px dashed var(--trait)}
.fs:first-of-type{border-top:0}.fs.du b{color:#a2321f}.fs.ok b{color:#2f7a3a}.fs span:nth-child(3){color:var(--doux)}
.fm{font-size:13.5px;padding:6px 8px;border-radius:8px;margin:5px 0;white-space:pre-wrap}.fm small{display:block;color:var(--doux);font-size:11.5px}
.fm.recu{background:color-mix(in srgb,var(--carte) 60%,#d9e8f5);margin-right:30px}.fm.envoye{background:color-mix(in srgb,var(--carte) 60%,#e3f0d8);margin-left:30px}
.f-notes{font-size:13px;white-space:pre-wrap;color:var(--doux)}
.recherche-client{display:flex;gap:6px;margin:0 0 10px}.recherche-client input{flex:1;font:inherit;padding:8px 10px;border:1px solid var(--trait);border-radius:8px;background:var(--carte);color:var(--texte)}
.ev.cliquable .ev-t,.imp-n.cliquable{text-decoration:underline dotted;cursor:pointer}
/* ====== Gestes ====== */
.tache{transition:transform .15s}
.tache.geste-fait{box-shadow:inset 8px 0 0 #2f7a3a}.tache.geste-report{box-shadow:inset -8px 0 0 #c08a1e}
.menu-report{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 4px 10px;padding:8px 10px;background:var(--carte);border:1px dashed #c08a1e;border-radius:8px;font-size:13px;color:var(--doux)}
.menu-report button{font:inherit;font-size:13px;border:1px solid var(--trait);background:var(--carte);color:var(--encre);border-radius:999px;padding:5px 10px}
/* ====== Carte du royaume ====== */
.carte-royaume{position:relative;margin:6px 0 12px;border:3px solid #6b5636;border-radius:8px;overflow:hidden;aspect-ratio:4/3;box-shadow:0 4px 12px rgba(40,20,0,.35)}
.carte-royaume svg{position:absolute;inset:0;width:100%;height:100%}
.lieu{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:0;font:inherit;color:#3b2412;opacity:.6}
.lieu i{position:relative;font-style:normal;font-size:20px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:rgba(255,248,230,.85);border:2px solid #8a6a3e}
.lieu span{font-family:"Cinzel",serif;font-size:9px;font-weight:700;background:rgba(255,248,230,.85);border-radius:4px;padding:0 3px;max-width:78px;line-height:1.1;text-align:center}
.lieu b{position:absolute;top:-6px;right:-8px;font-family:inherit;background:#a2321f;color:#fff;font-size:11px;border-radius:999px;padding:0 5px;line-height:16px}
.lieu.allume{opacity:1}.lieu.allume i{border-color:#c9a227;box-shadow:0 0 0 3px rgba(242,193,78,.45),0 0 14px 4px rgba(255,210,90,.75);animation:lueur 2.4s ease-in-out infinite}
.lieu.en-retard i{border-color:#a2321f}
@keyframes lueur{50%{box-shadow:0 0 0 3px rgba(242,193,78,.25),0 0 22px 8px rgba(255,210,90,.9)}}
/* ====== Autres pôles ====== */
.poles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}
.pole{font:inherit;text-align:left;background:var(--carte);border:1px solid var(--trait);border-radius:8px;padding:8px;color:var(--texte);font-size:12.5px;line-height:1.25}
.pole b{display:block;font-family:"Cinzel",serif;font-size:12.5px;color:var(--encre);margin-bottom:3px}.pole em{font-style:normal;color:var(--doux)}

.menu-regle{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 8px;padding:8px 10px;background:var(--carte);border:1px dashed #2f7a3a;border-radius:8px;font-size:13px;color:var(--doux)}
.menu-regle button{font:inherit;font-size:13px;border:1px solid var(--trait);background:#fff;color:var(--encre);border-radius:999px;padding:5px 10px}
.imp .vert{font:inherit;font-size:13px;padding:4px 10px}
.imp.facture .imp-n{color:var(--doux)}
.fs .regle-1{font:inherit;font-size:12px;border:1px solid #2f7a3a;color:#2f7a3a;background:none;border-radius:999px;padding:1px 7px;margin-left:4px}

/* ====== L'aventure : bandeau, personnages, habitudes, boutique, armurerie, expédition ====== */
header{flex-wrap:wrap;row-gap:6px}
#bandeau{flex-basis:100%;display:flex;align-items:center;gap:8px;background:linear-gradient(#3b2a18,#24180d);border:2px solid var(--or);border-radius:6px;padding:5px 6px;color:#f3d58b;font-family:"Cinzel",serif}
#bandeau:empty{display:none}
.b-niv{flex:none;width:30px;height:30px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#f2c14e,#a8742a);color:#2b1d10;font-weight:700;font-size:15px;border:2px solid #5b350c;border-radius:50%}
.b-centre{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.b-rang{font-size:12px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-xp{display:block;height:7px;background:#1a110a;border:1px solid #6b4a2a;border-radius:4px;overflow:hidden}
.b-xp u{display:block;height:100%;background:linear-gradient(90deg,#7fd18a,#2f8f5b);text-decoration:none;transition:width .6s}
.b-or,.b-bt{flex:none;border:1px solid #6b4a2a;background:#1a110a;color:#f3d58b;border-radius:4px;font:inherit;font-size:14px;padding:4px 7px}
.b-or{font-weight:700}
.pix{image-rendering:pixelated;display:block}
/* personnages guides */
.guide{display:flex;gap:10px;align-items:flex-end;margin:6px 0 12px}
.guide-portrait{flex:none;background:linear-gradient(#cfe3ee,#9cc3d6);border:2px solid #3b2a18;border-radius:4px;padding:3px;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.guide-bulle{position:relative;flex:1;background:var(--carte);border:2px solid #3b2a18;border-radius:6px;padding:8px 10px;font-size:15px;line-height:1.35;box-shadow:2px 2px 0 rgba(0,0,0,.2)}
.guide-bulle::before{content:"";position:absolute;left:-9px;bottom:12px;border:8px solid transparent;border-right-color:#3b2a18;border-left:0}
.guide-bulle>b{display:block;font-family:"Cinzel",serif;font-size:12px;color:var(--bleu);letter-spacing:.04em;margin-bottom:2px}
.lieu i .pix{margin:auto}
/* sous-onglets */
.av-onglets{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.av-onglets::-webkit-scrollbar{display:none}
.av-onglets button{flex:none;border:1px solid var(--trait);background:var(--carte);color:var(--texte);border-radius:4px;padding:7px 10px;font:600 13px "Cinzel",serif;white-space:nowrap}
.av-onglets button.actif{background:linear-gradient(#a8742a,#7a4a12);color:#fff7e3;border-color:#5b350c}
.ch-titre .lien-vue{margin-left:auto;border:0;background:none;color:var(--bleu);font:inherit;font-size:13px}
.ch-titre{display:flex;align-items:center;gap:6px}
/* habitudes */
.habitudes-jour,.carte.grille-hab,.carte.expe{padding:10px 12px}
.moment{font-family:"Cinzel",serif;font-size:12px;color:var(--doux);letter-spacing:.05em;margin:10px 2px 4px}
.habitude{display:flex;align-items:center;gap:10px;padding:7px 4px;border-top:1px dashed rgba(160,120,60,.35)}
.habitude .hab-ico{font-size:22px;flex:none;width:28px;text-align:center}
.hab-txt{flex:1;min-width:0}.hab-txt b{display:block;font-weight:500}.hab-txt small{color:var(--doux);font-size:13px}
.hab-case{flex:none;width:32px;height:32px;border:2px solid var(--or);background:transparent;border-radius:4px;color:#fff;font-size:18px;font-weight:700}
.habitude.faite .hab-case{background:linear-gradient(#557a3c,#33502a);border-color:#243a1c}
.habitude.faite .hab-txt b{text-decoration:line-through;text-decoration-color:var(--vert);opacity:.7}
.gh-ligne{display:grid;grid-template-columns:minmax(90px,1.6fr) repeat(7,1fr);gap:3px;align-items:center;margin:3px 0}
.gh-tete em{font-style:normal;text-align:center;font-size:11px;color:var(--doux);line-height:1.1}
.gh-tete em.auj{color:var(--bleu);font-weight:700}
.gh-nom{font-size:13px;line-height:1.15;overflow:hidden}
.gh-case{display:block;padding:0;border:0;justify-self:center}
.gh-case .hab-case{width:28px;height:28px;font-size:14px}
.gh-case.futur{width:28px;height:28px;border:1px dashed var(--trait);border-radius:4px}
.ch-grille.trois{grid-template-columns:repeat(3,1fr);display:grid;gap:6px;margin-bottom:8px}
.ch-grille.trois .ch{background:var(--carte);border:1px solid var(--trait);border-radius:6px;padding:8px;text-align:center}
.ch-grille.trois .ch b{display:block;font-size:20px;font-family:"Cinzel",serif}.ch-grille.trois .ch span{font-size:12px;color:var(--doux)}
.serie{display:flex;justify-content:space-between;gap:8px;padding:5px 2px;border-top:1px dashed rgba(160,120,60,.3);font-size:15px}
.serie b{font-family:"Cinzel",serif;font-size:13px;color:var(--bleu);white-space:nowrap}.serie b.rouge{color:var(--rouge)}
.carte>.ch-titre{padding:10px 12px 4px}.carte>.serie,.carte>.moment,.carte>.objet{margin-left:12px;margin-right:12px}
.carte>.serie:last-child,.carte>.objet:last-child{margin-bottom:10px}
.competences{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 10px 12px}
.comp{text-align:center;border:1px solid var(--trait);border-radius:6px;padding:8px 4px;background:rgba(255,250,235,.35)}
.comp-bl{display:block;font-size:24px}.comp b{display:block;font-size:13px;line-height:1.1}.comp small{font-size:11px;color:var(--doux)}
/* défis */
.parchemin{background:linear-gradient(#f6e7c4,#ecd7a6);color:#2b1d10;border:2px solid #8a6a3e;border-radius:4px;margin:0 0 10px;box-shadow:3px 3px 0 rgba(60,35,10,.25)}
.parchemin.reclame{opacity:.6}
.pa-tete{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px dashed #8a6a3e;font-family:"Cinzel",serif}
.pa-tete span{font-weight:700;color:#7a4a12}
.pa-corps{padding:8px 12px 10px;font-size:15px}
.pa-bt{display:block;width:100%;margin-top:8px;border:2px solid #5b350c;background:linear-gradient(#f2c14e,#c99a2e);color:#2b1d10;font:700 14px "Cinzel",serif;padding:9px;border-radius:4px}
.pa-ok{margin-top:6px;color:#3c5a2a;font-family:"Cinzel",serif;font-size:13px}.pa-attente{margin-top:6px;color:#8a6a3e;font-style:italic}
/* boutique */
.solde{text-align:center;font-family:"Cinzel",serif;margin:4px 0 10px}.solde b{font-size:20px;color:var(--or)}
.articles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.article{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;background:var(--carte);border:2px solid var(--trait);border-radius:6px;padding:10px 8px}

/* armurerie */
.armure{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:6px;align-items:center;background:linear-gradient(#2b1f14,#3b2a18);border:2px solid var(--or);border-radius:6px;padding:10px 6px;margin-bottom:10px}

.arm-case.pleine{border-style:solid;border-color:var(--or);color:#f3d58b;box-shadow:0 0 8px rgba(243,213,139,.35) inset}

.objet{padding:6px 2px;border-top:1px dashed rgba(160,120,60,.3)}.objet b{display:block}.objet small{display:block;color:var(--texte);font-size:14px}.objet em{font-size:12px;color:var(--doux)}
.doux{color:var(--doux);font-size:12px;font-weight:400}
.rangs-galerie{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 10px 12px}
.rang-av{display:flex;flex-direction:column;align-items:center;text-align:center;border:1px solid var(--trait);border-radius:4px;padding:4px 2px}
.rang-av small{font-size:10px;line-height:1.1;font-family:"Cinzel",serif}

/* quête du mois */
.sq{display:flex;gap:10px;background:var(--carte);border:2px solid var(--trait);border-radius:6px;padding:10px;margin-bottom:8px}
.sq.acceptee{border-color:var(--or);box-shadow:0 0 0 2px rgba(216,164,65,.35)}.sq.accomplie{opacity:.65}
.sq-bl{font-size:28px;flex:none}.sq-c{flex:1;min-width:0}.sq-c b{display:block;font-family:"Cinzel",serif;font-size:15px}.sq-c small{display:block;font-size:14px;color:var(--texte);margin:2px 0}
.sq-rec{font-size:12px;color:var(--doux)}
/* expédition */
.expe label{display:block;margin:6px 0}.expe select{display:block;width:100%;margin-top:4px;padding:8px;font:inherit;background:rgba(255,250,235,.55);border:1px solid var(--trait);border-radius:4px;color:var(--texte)}
.expe-duree{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.expe-duree button{border:2px solid var(--trait);background:transparent;color:var(--texte);border-radius:4px;padding:8px 4px;font:600 15px "Cinzel",serif}
.expe-duree button small{display:block;font:12px "EB Garamond",serif;color:var(--doux)}
.expe-duree button.actif{border-color:var(--or);background:rgba(243,213,139,.25)}
button.grand{width:100%;padding:12px;font-size:16px;border-radius:4px}
.expedition-ecran{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:#24180d;color:#f3d58b}
.expe-ciel{position:relative;flex:1;overflow:hidden;background:linear-gradient(#5aa7d6,#bfe3f2 70%)}
.expe-ciel i{position:absolute;display:block}
.soleil{width:48px;height:48px;right:14%;top:12%;background:#ffd25a;box-shadow:0 0 0 6px rgba(255,210,90,.35)}
.nuage{height:14px;background:#fff;box-shadow:12px -8px 0 #fff,24px 0 0 #fff;width:30px;animation:nuage 40s linear infinite}
.nuage.n1{top:18%;left:-20%}.nuage.n2{top:32%;left:-40%;animation-duration:60s;animation-delay:-20s}
@keyframes nuage{to{transform:translateX(140vw)}}
.mont{bottom:22%;width:0;height:0;border-left:90px solid transparent;border-right:90px solid transparent;border-bottom:120px solid #6f8f5a;animation:defile 30s linear infinite}
.mont.m1{left:10%}.mont.m2{left:60%;border-bottom-color:#5d7a4a;border-bottom-width:90px;animation-delay:-15s}
@keyframes defile{from{transform:translateX(60vw)}to{transform:translateX(-80vw)}}
.sol{left:0;right:0;bottom:0;height:22%;background:repeating-linear-gradient(90deg,#8a6a3e 0 16px,#7a5a32 16px 32px);animation:sol 1.2s steps(4) infinite}
@keyframes sol{to{background-position:-32px 0}}
.expe-marcheur{position:absolute;left:50%;bottom:21%;transform:translateX(-50%);animation:pas .5s steps(2) infinite}
@keyframes pas{50%{transform:translate(-50%,-4px)}}
.expe-info{padding:18px 16px calc(22px + env(safe-area-inset-bottom));text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;border-top:3px solid var(--or)}

.expe-temps{font:700 54px "Silkscreen","Cinzel",monospace;letter-spacing:.04em}
.expe-barre{width:100%;max-width:420px;height:12px;background:#1a110a;border:2px solid #6b4a2a}.expe-barre u{display:block;height:100%;width:0;background:#7fd18a;text-decoration:none}
.expe-info button{padding:10px 18px;font-size:15px;border-radius:4px}

.arme [hidden]{display:none!important}

.arme-go{width:100%;margin-top:10px}
