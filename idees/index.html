<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boîte à idées</title>
<meta name="description" content="Dépose une idée pour Claude en deux secondes">
<meta name="theme-color" content="#24180d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* Boîte à idées (27/11/2026) : appli à part du Journal des quêtes, même serveur (onglet « Pense-bêtes » de la to-do list) */
:root{--encre:#3b2a18;--doux:#7a6448;--velin:#f3e5c4;--fond:#ead7ac;--or:#b8860b;--filet:#9a7a3a;--sang:#7a1c1c;--sombre:#24180d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--encre:#f1e3c2;--doux:#c9b48a;--velin:#2a2118;--fond:#1c160f;--filet:#6a5530;--sang:#d0654f}}
:root[data-theme="dark"]{--encre:#f1e3c2;--doux:#c9b48a;--velin:#2a2118;--fond:#1c160f;--filet:#6a5530;--sang:#d0654f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--fond);background-image:radial-gradient(ellipse at 50% 30%,rgba(255,250,230,.35),transparent 70%);color:var(--encre);font:18px/1.4 "EB Garamond",Georgia,serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:100%}
h1{font:700 22px/1.1 Cinzel,serif;color:var(--sang);margin:0;letter-spacing:.05em;display:flex;align-items:center;gap:10px}
h1 img{width:34px;height:34px;border-radius:6px}
h1 small{margin-left:auto;font:500 13px "EB Garamond",serif;color:var(--doux);letter-spacing:0}
.types{display:flex;flex-wrap:wrap;gap:8px}
.types button{flex:1 1 auto;min-height:44px;padding:6px 10px;border:1px solid var(--filet);background:transparent;color:var(--encre);border-radius:22px;font:500 16px "EB Garamond",serif}
.types button.actif{background:var(--sang);border-color:var(--sang);color:#f6ebcf}
.parchemin{position:relative;border:3px double var(--filet);background:var(--velin);border-radius:4px;padding:4px}
textarea{display:block;width:100%;min-height:28vh;border:0;background:transparent;color:var(--encre);font:20px/1.45 "EB Garamond",serif;padding:10px;resize:vertical;outline:none}
textarea::placeholder{color:var(--doux);font-style:italic}
.ecoute{position:absolute;right:10px;bottom:8px;font-size:14px;color:var(--sang);font-style:italic}
.actions{display:flex;gap:10px}
.micro{width:84px;min-height:64px;border-radius:14px;border:2px solid var(--sang);background:transparent;color:var(--sang);font-size:30px}
.micro.on{background:var(--sang);color:#fff;animation:pouls 1.2s infinite}
@keyframes pouls{50%{box-shadow:0 0 0 8px rgba(122,28,28,.18)}}
.deposer{flex:1;min-height:64px;border-radius:14px;border:0;background:linear-gradient(#8e2a1c,#5c140e);color:#f6ebcf;font:700 18px Cinzel,serif;letter-spacing:.04em;box-shadow:0 3px 0 #3b0c08}
.deposer:active{transform:translateY(2px);box-shadow:0 1px 0 #3b0c08}
.deposer:disabled{opacity:.6}
.attente{font-size:15px;color:var(--sang);text-align:center}
details{border-top:1px solid var(--filet);padding-top:8px}
summary{font:500 16px Cinzel,serif;color:var(--doux);cursor:pointer;min-height:36px;display:flex;align-items:center}
.idee{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dotted var(--filet)}
.idee div{flex:1;min-width:0;overflow-wrap:anywhere}
.idee small{display:block;color:var(--doux);font-size:13px}
.idee button{border:1px solid var(--filet);background:transparent;color:var(--doux);border-radius:8px;min-width:40px;min-height:36px;font-size:15px}
.aide{color:var(--doux);font-size:15px;font-style:italic}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140%);background:var(--sombre);color:#f6ebcf;padding:12px 18px;border-radius:12px;font-size:16px;max-width:92vw;transition:transform .25s;z-index:9}
#toast.vu{transform:translateX(-50%) translateY(0)}
.vole{position:fixed;font-size:40px;pointer-events:none;animation:vole 1s ease-in forwards;z-index:8}
@keyframes vole{to{transform:translateY(-60vh) rotate(-25deg) scale(.4);opacity:0}}
.cle{display:flex;flex-direction:column;gap:10px}
.cle input{font:18px "EB Garamond",serif;padding:10px;border:1px solid var(--filet);border-radius:8px;background:var(--velin);color:var(--encre)}
.cle button{min-height:48px;border-radius:10px;border:0;background:var(--sang);color:#f6ebcf;font:700 16px Cinzel,serif}
/* 27/11 : fenêtre réduite (vue contextuelle Samsung, écran partagé) : seulement le texte, le micro et « Déposer » */
@media (max-height:520px),(max-width:300px){h1,details,.attente{display:none}main{padding:6px;gap:6px}textarea{min-height:0;height:calc(100vh - 92px);font-size:17px}.micro,.deposer{min-height:52px}.micro{width:64px;font-size:24px}.deposer{font-size:15px}}
</style>
</head>
<body>
<main id="app">
  <h1><img src="icone-192.png" alt="">Boîte à idées<small id="compte"></small></h1>
  <div class="parchemin">
    <textarea id="texte" placeholder="Une idée, une demande pour Claude, une quête à créer…"></textarea>
    <span class="ecoute" id="ecoute" hidden>j’écoute…</span>
  </div>
  <div class="actions">
    <button class="micro" id="micro" title="Dicter">🎙️</button>
    <button class="deposer" id="deposer">Déposer l’idée</button>
  </div>
  <div class="attente" id="attente" hidden></div>
  <details id="reserve"><summary>📜 Dans la boîte</summary><div id="liste"><div class="aide">…</div></div>
    <p class="aide">Pour tout donner à Claude, dis-lui : « traite la boîte à idées ».</p></details>
</main>
<div id="toast"></div>
<script>
// Même serveur que le Journal des quêtes : fonctions appPenseBete / appPenseBetes (onglet « Pense-bêtes » de la to-do list)
var API = 'https://script.google.com/macros/s/AKfycbyJnnZpvxjD49iS-2nT9j0VMxLHY9k9exzrR4W17hedh1TV29pyT0rIRAe9GUOnOFHi/exec';
// 27/11 : plus de catégories à choisir (Cairn dépose en vrac, Claude trie). Préfixe fixe pour garder le format de l'onglet.
var PREFIXE = '[Vrac] ';
function $(i) { return document.getElementById(i); }
function lire(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function ecrire(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function toast(t) { var z = $('toast'); z.textContent = t; z.classList.add('vu'); clearTimeout(toast.t); toast.t = setTimeout(function () { z.classList.remove('vu'); }, 2600); }
function vibrer(m) { try { navigator.vibrate && navigator.vibrate(m); } catch (e) {} }

// Clé de l'application : la même que le Journal (même adresse, donc déjà connue du téléphone si le Journal est installé)
var CLE = (function () {
  var m = location.search.match(/[?&]cle=([A-Za-z0-9]+)/);
  if (m) { ecrire('cle-quetes', m[1]); if (history.replaceState) history.replaceState(null, '', location.pathname); }
  return lire('cle-quetes', '');
})();

function appeler(fn, args, ok, ko) {
  fetch(API, { method: 'POST', body: JSON.stringify({ action: 'app', fn: fn, args: [CLE].concat(args) }) })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.ok) ok(d.r); else ko(new Error(d.erreur || 'Erreur'), true); })
    .catch(function () { ko(new Error('Pas de réseau'), false); });
}

// ---------- Brouillon gardé ----------
var zone = $('texte');
zone.value = lire('idee-brouillon', '');
zone.oninput = function () { ecrire('idee-brouillon', zone.value || null); };

// ---------- File d'attente (bord de bassin sans réseau : l'idée part dès que le réseau revient) ----------
function file() { try { return JSON.parse(lire('idee-attente', '[]')) || []; } catch (e) { return []; } }
function majAttente() { var n = file().length; $('attente').hidden = !n; $('attente').textContent = n ? '⏳ ' + n + ' idée' + (n > 1 ? 's' : '') + ' en attente de réseau : elle' + (n > 1 ? 's partiront' : ' partira') + ' toute' + (n > 1 ? 's' : '') + ' seule' + (n > 1 ? 's' : '') + '.' : ''; }
var envoiEnCours = false;
function viderFile() {
  var f = file(); if (!f.length || envoiEnCours || !CLE) { majAttente(); return; }
  envoiEnCours = true;
  appeler('appPenseBete', [f[0]], function (l) {
    var r = file(); r.shift(); ecrire('idee-attente', JSON.stringify(r)); envoiEnCours = false;
    afficherListe(l); majAttente(); if (r.length) viderFile();
  }, function (e, serveur) {
    envoiEnCours = false; majAttente();
    if (serveur) { toast('⚠️ ' + e.message); if (/Accès réservé/.test(e.message)) { ecrire('cle-quetes', null); demanderCle(); } }
  });
}
window.addEventListener('online', viderFile);
document.addEventListener('visibilitychange', function () { if (!document.hidden) viderFile(); });

// ---------- Déposer ----------
$('deposer').onclick = function () {
  // 27/11 : si la dictée tourne encore, on la coupe SANS attendre ses derniers mots (sinon ils réécrivaient le texte
  // dans la zone après l'envoi : l'idée semblait ne pas partir, on rappuyait, et elle partait en double).
  couperMicro();
  var t = zone.value.trim(); if (!t) { toast('Écris ou dicte d’abord ton idée'); zone.focus(); return; }
  var f = file(), x = PREFIXE + t;
  var der = lire('idee-derniere', ''), maintenant = Date.now();
  if (f.indexOf(x) !== -1 || (der === x && maintenant - (+lire('idee-derniere-t', 0)) < 120000)) { zone.value = ''; ecrire('idee-brouillon', null); toast('📜 Cette idée est déjà dans la boîte'); return; }
  ecrire('idee-derniere', x); ecrire('idee-derniere-t', String(maintenant));
  f.push(x); ecrire('idee-attente', JSON.stringify(f));
  zone.value = ''; ecrire('idee-brouillon', null);
  var p = document.createElement('div'); p.className = 'vole'; p.textContent = '📜';
  var r = $('deposer').getBoundingClientRect(); p.style.left = (r.left + r.width / 2 - 20) + 'px'; p.style.top = (r.top - 10) + 'px';
  document.body.appendChild(p); setTimeout(function () { p.remove(); }, 1100);
  vibrer([30, 40, 30]); toast(navigator.onLine === false ? '📜 Idée gardée : elle partira dès que le réseau revient' : '📜 Idée déposée dans la boîte');
  viderFile();
};

// ---------- Liste des idées en réserve ----------
function echap(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function afficherListe(l) {
  l = l || []; $('compte').textContent = l.length ? l.length + ' en réserve' : '';
  $('liste').innerHTML = l.length ? l.map(function (x) { return '<div class="idee"><div>' + echap(x.texte) + '<small>' + echap(x.date) + '</small></div><button data-l="' + x.ligne + '" title="Retirer">✕</button></div>'; }).join('')
    : '<div class="aide">La boîte est vide : Claude a tout traité.</div>';
  [].forEach.call($('liste').querySelectorAll('[data-l]'), function (b) {
    b.onclick = function () { b.disabled = true; appeler('appPenseBetes', [+b.dataset.l], afficherListe, function (e) { b.disabled = false; toast('⚠️ ' + e.message); }); };
  });
}
function chargerListe() { appeler('appPenseBetes', [''], afficherListe, function (e) { $('liste').innerHTML = '<div class="aide">' + echap(e.message) + '</div>'; }); }

// ---------- Dictée ----------
var Reco = window.SpeechRecognition || window.webkitSpeechRecognition, reco = null, base = '';
function arreterMicro() { if (reco) { try { reco.stop(); } catch (e) {} } }
function couperMicro() { if (!reco) return; var r = reco; r.onresult = null; r.onerror = null; reco = null; $('micro').classList.remove('on'); $('ecoute').hidden = true; try { r.abort(); } catch (e) {} }
function lancerMicro() {
  if (!Reco) { zone.focus(); toast('Dictée directe indisponible ici : utilise le micro du clavier'); return; }
  if (reco) { arreterMicro(); return; }
  reco = new Reco(); reco.lang = 'fr-FR'; reco.continuous = true; reco.interimResults = true;
  base = zone.value.trim(); base = base ? base + ' ' : '';
  reco.onresult = function (ev) {
    var fin = '', prov = '';
    for (var i = 0; i < ev.results.length; i++) { if (ev.results[i].isFinal) fin += ev.results[i][0].transcript; else prov += ev.results[i][0].transcript; }
    zone.value = base + fin + prov; ecrire('idee-brouillon', zone.value);
  };
  reco.onerror = function (e) { if (e.error === 'not-allowed') toast('Autorise le micro pour dicter'); };
  var moi = reco;
  reco.onend = function () { if (reco !== moi) return; reco = null; $('micro').classList.remove('on'); $('ecoute').hidden = true; };
  try { reco.start(); $('micro').classList.add('on'); $('ecoute').hidden = false; vibrer(20); } catch (e) { reco = null; }
}
$('micro').onclick = lancerMicro;

// ---------- Première ouverture sans clé ----------
function demanderCle() {
  $('app').innerHTML = '<h1><img src="icone-192.png" alt="">Boîte à idées</h1><div class="cle"><p>Première ouverture : colle la <b>clé de l’application</b> (la même que le Journal des quêtes : to-do list › Réglages).</p>'
    + '<input id="cle" autocomplete="off" placeholder="Clé de l’application"><button id="ok">Ouvrir la boîte</button></div>';
  $('ok').onclick = function () { var v = $('cle').value.trim().replace(/[^A-Za-z0-9]/g, ''); if (v) { ecrire('cle-quetes', v); location.replace(location.pathname); } };
}

if (!CLE) demanderCle();
else {
  majAttente(); viderFile(); chargerListe();
  if (/[?&]micro=1/.test(location.search)) { if (history.replaceState) history.replaceState(null, '', location.pathname); setTimeout(lancerMicro, 300); }
  else if (!zone.value) zone.focus();
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
